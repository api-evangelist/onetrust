summary: >-
  OneTrust ships a substantial client-side embeddable surface, and it is arguably the part of the
  product most developers actually touch — the cookie banner, the preference centre, the vendor list
  and the hosted/embedded web form are rendered by OneTrust code inside the customer's page or app,
  configured from the OneTrust tenant rather than from the API. These are distinct from the SDK
  packages in packages/onetrust-packages.yml: those are the delivery vehicles, these are the UI
  surfaces they render.
