components:
  schemas:
    AttributePredicate:
      type: object
      properties:
        field:
          description: The field by which to filter results.
          type: string
        operator:
          description: The relationship that must be met between the field and the value.
          type: string
          enum:
          - EQUAL_TO
          - NOT_EQUAL_TO
          - GREATER_THAN
          - GREATER_THAN_EQUAL_TO
          - LESS_THAN
          - LESS_THAN_EQUAL_TO
          - BETWEEN
        value:
          description: The value by which to filter results.
          type: object
          oneOf:
          - type: string
            format: uuid
          - type: string
            format: date
          - type: string
            format: date-time
          - type: string
          - type: number
        toValue:
          description: The end value by which to filter results.
          type: object
          oneOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: string
          - type: number
      required:
      - field
    EntityBasicUserInformation:
      type: object
      properties:
        id:
          description: The unique identifier of the user who last modified the record.
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        name:
          description: The name of the user who last modified the record.
          type: string
          example: First Last
        email:
          description: The email address of the user who last modified the record.
          type: string
          example: user@gmail.com
        initials:
          description: The initials of the user who last modified the record.
          type: string
          example: FL
    Sort:
      type: object
      properties:
        sorted:
          description: This flag indicates whether the results were sorted.
          type: boolean
          example: true
        unsorted:
          description: This flag indicates whether the results were unsorted.
          type: boolean
          example: false
        empty:
          description: This flag indicates whether sort criteria was left undefined.
          type: boolean
          example: false
    CustomLinkTypeCreateRequest:
      type: object
      properties:
        name:
          description: The name of the relationship type.
          type: string
          example: Product/Service
        description:
          description: The description of the relationship type.
          type: string
          example: Defined link between Vendor and Product/Service
        linkAssociations:
          description: The details of linked relationships.
          type: array
          items:
            $ref: '#/components/schemas/LinkTypeAssociationRequest'
          example:
          - entityType1:
              name: Vendors
            entityType2:
              name: Assets
          - entityType1:
              name: Vendors
            entityType2:
              name: Vendors
          uniqueItems: true
        entityType1ToEntityType2EntityLinkName:
          description: The name of the source object type's relationship to the target object type.
          type: string
          example: OneTrust provides GRC
        entityType2ToEntityType1EntityLinkName:
          description: The name of the target object type's relationship to the source object type.
          type: string
          example: GRC belongs to OneTrust
      required:
      - linkAssociations
      - name
    PageLinkTypeDetailedInformation:
      type: object
      properties:
        content:
          description: The data of the returned objects.
          example:
          - id: 123e4567-e89b-12d3-a456-426614174000
            name: Data Transfer Link
          items:
            $ref: '#/components/schemas/LinkTypeDetailedInformation'
          type: array
        totalElements:
          description: The total number of results in the list.
          type: integer
          format: int64
          example: 150
          minimum: 0
        totalPages:
          description: The total number of pages in the list.
          type: integer
          format: int32
          example: 15
          minimum: 0
        number:
          description: The page number of the results.
          type: integer
          format: int32
          example: 0
          minimum: 0
        size:
          description: The number of results per page.
          type: integer
          format: int32
          example: 10
          maximum: 1000
          minimum: 20
        first:
          description: This flag indicates whether the current page is the first page of the list.
          type: boolean
          example: true
        last:
          description: This flag indicates whether the current page is the last page of the list.
          type: boolean
          example: false
        empty:
          description: The flag indicates whether no results exist on the page.
          type: boolean
          example: false
        numberOfElements:
          description: The number of results on the current page.
          type: integer
          format: int32
          example: 10
          minimum: 0
        hasNext:
          description: This flag indicates whether there is a next page in the list.
          type: boolean
          example: true
        hasPrevious:
          description: This flag indicates whether there is a previous page in the list.
          type: boolean
          example: false
        sort:
          description: The sort criteria that dictates the order of the results.
          example:
            sorted: true
            unsorted: false
            empty: false
          $ref: '#/components/schemas/Sort'
        pageable:
          description: The configuration parameters of the page.
          $ref: '#/components/schemas/Pageable'
      example:
        content:
        - id: 123e4567-e89b-12d3-a456-426614174000
          name: Data Transfer Link
          description: Link type for data transfer relationships
        totalElements: 150
        totalPages: 15
        number: 0
        size: 10
        first: true
        last: false
        empty: false
        numberOfElements: 10
      required:
      - content
      - empty
      - first
      - hasNext
      - hasPrevious
      - last
      - number
      - numberOfElements
      - size
      - totalElements
      - totalPages
    LinkTypeDetailedInformation:
      type: object
      properties:
        id:
          description: The unique identifier of the relationship type.
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        name:
          description: 'The name of the relationship type. '
          type: string
          example: Product/Service
          maxLength: 255
          minLength: 1
        nameKey:
          description: The name key of the relationship type used for translation purposes.
          type: string
          example: link.type.productservice.name
        seeded:
          description: This flag indicates whether the relationship type is seeded.
          type: boolean
          example: true
          default: 'false'
        moduleName:
          description: The name of the product where the relationship type exists.
          type: string
          example: CustomEntityManagement
        description:
          description: The description of the relationship type.
          type: string
          example: Links between vendors and their products
        descriptionKey:
          description: The description key of the relationship type used for translation purposes.
          type: string
          example: entity.link.vendor_product.description
        entityType1ToEntityType2EntityLinkName:
          description: The name of the source object type's relationship to the target object type.
          type: string
          example: Vendor provides Product
        entityType1ToEntityType2EntityLinkNameKey:
          description: The name key of the source object type's relationship to the target object type used for translation purposes.
          type: string
          example: entity.link.vendor_to_product
        entityType2ToEntityType1EntityLinkName:
          description: The name of the target object type's relationship to the source object type.
          type: string
          example: Product belongs to Vendor
        entityType2ToEntityType1EntityLinkNameKey:
          description: The name key of the target object types's relationship to the source object type.
          type: string
          example: entity.link.product_to_vendor
        enableAudit:
          description: This flag indicates whether audit activity is enabled.
          type: boolean
          example: true
          default: 'false'
        allowNewCustomLinkAssociation:
          description: This flag indicates whether new relationship links are allowed.
          type: boolean
          example: false
          default: 'true'
        auditFields:
          description: The activity details of when the record was created and last updated.
          $ref: '#/components/schemas/EntityRecordAuditInformation'
        linkAssociations:
          description: The details of linked relationships.
          type: array
          items:
            $ref: '#/components/schemas/LinkTypeAssociationInformation'
          example: '[{"moduleName": "Inventory" ,"entityTypePair": {"entityType1": {"name": "Vendors"}, "entityType2": {"name": "Assets"}}, {"entityType1": {"name": "Vendors"}, "entityType2": {"name": "Vendors"}}}]'
      required:
      - id
      - linkAssociations
      - name
    Pageable:
      type: object
      properties:
        pageNumber:
          description: The page number of the results.
          type: integer
          format: int32
          example: 0
        pageSize:
          description: The number of results per page.
          type: integer
          format: int32
          example: 10
        offset:
          description: The number of results to exclude from the start of the list.
          type: integer
          format: int64
          example: 0
        sort:
          description: The sort criteria that dictates the order of the results.
          $ref: '#/components/schemas/Sort'
        paged:
          description: This flag indicates whether the list is paged.
          type: boolean
          example: true
        unpaged:
          description: This flag indicates whether the list is not paged.
          type: boolean
          example: false
    LinkTypeInformation:
      type: object
      properties:
        id:
          description: The unique identifier of the relationship type.
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        name:
          description: The name of the relationship type.
          type: string
          example: Product/Service
          maxLength: 255
          minLength: 1
        nameKey:
          description: The name key of the relationship type used for translation purposes.
          type: string
          example: link.type.productservice.name
        seeded:
          description: This flag indicates whether the relationship type is seeded.
          type: boolean
          example: true
          default: 'false'
        moduleName:
          description: The name of the product where the relationship type exists.
          type: string
          example: CustomEntityManagement
        description:
          description: The description of the relationship type.
          type: string
          example: Links between vendors and their products
        descriptionKey:
          description: The description key of the relationship type used for translation purposes.
          type: string
          example: entity.link.vendor_product.description
        entityType1ToEntityType2EntityLinkName:
          description: The name of the source object type's relationship to the target object type.
          type: string
          example: Vendor provides Product
        entityType1ToEntityType2EntityLinkNameKey:
          description: The name key of the source object type's relationship to the target object type used for translation purposes.
          type: string
          example: entity.link.vendor_to_product
        entityType2ToEntityType1EntityLinkName:
          description: The name of the target object type's relationship to the source object type.
          type: string
          example: Product belongs to Vendor
        entityType2ToEntityType1EntityLinkNameKey:
          description: The name key of the target object type's relationship to the source object type used for translation purposes.
          type: string
          example: entity.link.product_to_vendor
        enableAudit:
          description: This flag indicates whether audit activity is enabled.
          type: boolean
          example: true
          default: 'false'
        allowNewCustomLinkAssociation:
          description: This flag indicates whether new custom relationship links are allowed.
          type: boolean
          example: false
          default: 'true'
        auditFields:
          description: The activity details of when the record was created and last updated.
          $ref: '#/components/schemas/EntityRecordAuditInformation'
      example:
