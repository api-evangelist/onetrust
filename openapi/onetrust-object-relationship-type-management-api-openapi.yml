            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - OBJECT_MANAGER
        - OBJECT_MANAGER_WRITE
        - INTEGRATION
  /v1/entity-link-types/search:
    post:
      operationId: findAllByLinkTypeAndCriteriaUsingPOST
      summary: Get List of Relationship Link Types
      description: 'Use this API to retrieve a list of all Relationship Types by key terms and filters.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Relationship Type Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: page
        in: query
        description: The page number of the results.
        schema:
          description: Results page to be retrieved (0..N). Example- '?page=1
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          description: Number of records per page (1..50). Example- '?size=20
          type: integer
          format: int32
          default: 10
          maximum: 2000
          minimum: 1
        example: 50
      - name: sort
        in: query
        description: The sort criteria that dictates the order of the results.
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
        example: name,asc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeQueryCriteria'
            examples:
              Search Relationship Types by name and target type:
                summary: Example of searching for Relationship Types by name and target type
                description: Search Relationship Types by name and target type
                value:
                  fullText: ''
                  filters:
                  - field: name
                    value: relationship_01
                    operator: EQUAL_TO
                  - field: domainEntityType2Id
                    value: b38df610-68a4-4db5-949d-92976463abab
                    operator: EQUAL_TO
      responses:
        '200':
          description: OK - Returns a paginated list of relationship types matching the criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLinkTypeDetailedInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - OBJECT_MANAGER
        - OBJECT_MANAGER_READ
        - OBJECT_MANAGER_WRITE
  /v1/entity-link-types/{entityLinkTypeId}:
    get:
      operationId: getLinkTypeUsingGET
      summary: Get Relationship Type
      description: 'Use this API to retrieve the details of a single Relationship Type by its unique identifier.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Relationship Type Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: entityLinkTypeId
        in: path
        description: 'This flag indicates whether the object type is seeded. '
        required: true
        schema:
          description: Unique identifier (UUID) of the relationship type to retrieve
          type: string
          format: uuid
        example: 2aa71ead-0c9a-416a-8471-bdfb67c8d113
      responses:
        '200':
          description: OK - Returns the complete details of the requested relationship type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkTypeInformation'
              examples:
                model dataset Response:
                  summary: Example of relationship type details
                  description: model dataset Response
                  value:
                    id: bea0115d-27ae-4b6e-bc52-bed53c4abcf1
                    name: relationship_01
                    nameKey: 5596a8d1-be57-46a3-9993-f0eb0b94a1dd
                    schemaName: bb89c78b-7be5-4b2a-b91c-f5c1d1a239e2
                    seeded: false
                    moduleName: CustomEntityManagement
                    description: desc
                    descriptionKey: 7803bc48-d046-4c02-b230-36247e7e1a77
                    entityType1ToEntityType2EntityLinkName: model
                    entityType1ToEntityType2EntityLinkNameKey: c2e0fade-62d5-4728-84bd-13a02bc888f2
                    entityType2ToEntityType1EntityLinkName: dataset
                    entityType2ToEntityType1EntityLinkNameKey: d346be41-2e24-4704-bb56-4537217a331a
                    enableAudit: true
                    allowNewCustomLinkAssociation: true
                    auditFields:
                      createdDate: '2025-06-12T08:52:58.307Z'
                      lastUpdatedDate: '2025-06-12T08:52:58.307Z'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
