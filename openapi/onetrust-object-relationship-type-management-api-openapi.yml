      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Object Relationship Type Management
  description: The Object Relationship Type Management APIs are used to manage the types of relationships that can exist between objects.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
paths:
  /v1/entity-link-types:
    post:
      operationId: createCustomLinkTypeUsingPOST
      summary: Create Relationship Type between Objects
      description: 'Use this API to create a new Relationship Type between two object types.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Relationship Type Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomLinkTypeCreateRequest'
            examples:
              Create model dataset Relationship:
                summary: Example of creating a model dataset relationship type
                description: Creates a relationship type that allows connecting Business Units to objects they own
                value:
                  name: relationship_01
                  description: desc
                  entityType1ToEntityType2EntityLinkName: model
                  entityType2ToEntityType1EntityLinkName: dataset
                  linkAssociations:
                  - entityType1:
                      id: 286aeb99-fe6c-4f01-baaa-e24b8e689a84
                      name: models
                      nameKey: CE.Models.Name
                      seeded: true
                      moduleName: CustomEntityManagement
                      schemaName: models
                    entityType2:
                      id: b821e04e-73f9-4bc8-b925-bfe72a599633
                      name: datasets
                      nameKey: CE.Datasets.Name
                      seeded: true
                      moduleName: CustomEntityManagement
                      schemaName: datasets
      responses:
        '201':
          description: Created - The relationship type has been successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkTypeDetailedInformation'
              examples:
                Business Ownership Response:
                  summary: Example of created relationship type details
                  description: Business Ownership Response
                  value:
                    id: bea0115d-27ae-4b6e-bc52-bed53c4abcf1
                    name: relationship_01
                    nameKey: 5596a8d1-be57-46a3-9993-f0eb0b94a1dd
                    schemaName: bb89c78b-7be5-4b2a-b91c-f5c1d1a239e2
                    seeded: false
                    moduleName: CustomEntityManagement
                    description: desc
                    descriptionKey: 7803bc48-d046-4c02-b230-36247e7e1a77
                    entityType1ToEntityType2EntityLinkName: model
                    entityType1ToEntityType2EntityLinkNameKey: c2e0fade-62d5-4728-84bd-13a02bc888f2
                    entityType2ToEntityType1EntityLinkName: dataset
                    entityType2ToEntityType1EntityLinkNameKey: d346be41-2e24-4704-bb56-4537217a331a
                    enableAudit: true
                    allowNewCustomLinkAssociation: true
                    auditFields:
                      createdDate: '2025-06-12T08:52:58.307Z'
                      lastUpdatedDate: '2025-06-12T08:52:58.307Z'
                    linkAssociations:
                    - id: 28
                      entityType1:
                        id: 286aeb99-fe6c-4f01-baaa-e24b8e689a84
                        name: models
                        nameKey: CE.Models.Name
                        seeded: true
                        moduleName: CustomEntityManagement
                        schemaName: models
                      entityType2:
                        id: b821e04e-73f9-4bc8-b925-bfe72a599633
                        name: datasets
                        nameKey: CE.Datasets.Name
                        seeded: true
                        moduleName: CustomEntityManagement
                        schemaName: datasets
                      enabled: true
                      seeded: false
                      auditFields:
                        createdDate: '2025-06-12T08:52:58.308Z'
                        lastUpdatedDate: null
                        createdBy:
                          id: 41955b71-e581-4187-ab6c-d00d1403350c
                          name: null
                          email: null
                          initials: null
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
