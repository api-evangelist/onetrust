        - CONSENT
components:
  schemas:
    ConsentAPI_LinkedIdentityGroupDto:
      type: object
      properties:
        id:
          description: The unique identifier of the data subject group.
          type: string
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        name:
          description: The name of the data subject group.
          type: string
          example: a2229953-b4b5-4042-8cb9-b78038cc4c41
        identifier:
          description: The data subject identifier of the data subject.
          type: string
          example: example@otprivacy.com
        isPrimary:
          description: This flag indicates whether the data subject identifier is the primary identifier associated with the data subject group.
          type: boolean
          example: true
        addedDate:
          description: The date and time that the data subject was added to the data subject group.
          type: string
          format: date-time
          example: '2020-05-30T12:23:42.145Z'
    ConsentAPI_PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/ConsentAPI_SortObject'
        pageNumber:
          type: integer
          format: int32
        paged:
          type: boolean
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    ConsentAPI_LinkedIdentityGroupDataSubjectResponseDto:
      type: object
      properties:
        id:
          description: Unique identifier (UUID) of the data subject
          type: string
          format: uuid
          example: a3f8d56a-b123-4b2a-9eab-12cfea1bc456
        identifier:
          description: The original identifier value for the data subject
          type: string
          example: user@example.com
        identifierType:
          description: Type of identifier (e.g., EMAIL, PHONE)
          type: string
          example: EMAIL
        addedDate:
          description: Date and time when the data subject was added to the group
          type: string
          format: date-time
          example: '2024-11-12T10:15:30'
    ConsentAPI_LinkedIdentityGroupResponseDto:
      type: object
      properties:
        id:
          description: Unique identifier of the linked identity group
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        createdDate:
          description: Date and time when the group was created
          type: string
          format: date-time
          example: '2024-11-12T10:15:30'
        groupName:
          description: Name of the group
          type: string
          example: UserAccountGroup
        primaryDataSubjects:
          description: List of primary data subjects in the group
          type: array
          items:
            $ref: '#/components/schemas/ConsentAPI_LinkedIdentityGroupDataSubjectResponseDto'
        memberDataSubjects:
          description: List of member data subjects in the group
          type: array
          items:
            $ref: '#/components/schemas/ConsentAPI_LinkedIdentityGroupDataSubjectResponseDto'
    ConsentAPI_LinkedIdentityGroupPageItemSliceDto:
      type: object
      properties:
        content:
          items:
            $ref: '#/components/schemas/ConsentAPI_LinkedIdentityGroupPageItemDto'
          type: array
        number:
          description: The page number of the results.
          type: integer
          format: int32
          example: 1
        size:
          description: The number of results per page.
          type: integer
          format: int32
          example: 20
        pageable:
          $ref: '#/components/schemas/ConsentAPI_PageableObject'
        last:
          description: Flag indicating whether this is the last page or not.
          type: boolean
          example: false
        sort:
          $ref: '#/components/schemas/ConsentAPI_SortObject'
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
        requestContinuation:
          description: The token used to paginate a response if the number of records is more than a page.
          type: string
          example: '{\"compositeToken\": \"jmxpAKZxe9nZkAoAAAAAAA==\"}'
    ConsentAPI_LinkedIdentityGroupDtoSliceDto:
      type: object
      properties:
        content:
          items:
            $ref: '#/components/schemas/ConsentAPI_LinkedIdentityGroupDto'
          type: array
        number:
          description: The page number of the results.
          type: integer
          format: int32
          example: 1
        size:
          description: The number of results per page.
          type: integer
          format: int32
          example: 20
        pageable:
          $ref: '#/components/schemas/ConsentAPI_PageableObject'
        last:
          description: Flag indicating whether this is the last page or not.
          type: boolean
          example: false
        sort:
          $ref: '#/components/schemas/ConsentAPI_SortObject'
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
        requestContinuation:
          description: The token used to paginate a response if the number of records is more than a page.
          type: string
          example: '{\"compositeToken\": \"jmxpAKZxe9nZkAoAAAAAAA==\"}'
    ConsentAPI_LinkedIdentityGroupPageItemDto:
      type: object
      properties:
        id:
          description: The unique identifier for a data subject group.
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        name:
          description: The unique name for a data subject group.
          type: string
          example: Marketing Data Subject Group
        createdDate:
          description: The date on which the data subject group was created.
          type: string
          format: date-time
          example: '2020-05-30T12:23:42.145Z'
        lastModifiedDate:
          description: The date on which the data subject group was last modified.
          type: string
          format: date-time
          example: '2020-05-30T12:23:42.145Z'
    ConsentAPI_SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    ConsentAPI_LinkedIdentityGroupRequestDto:
      type: object
      properties:
        groupName:
          description: A user-defined name for the group of linked identities.
          type: string
          example: LIG_1
        memberIdentifiers:
          description: A list of all member identifiers that belong to the group.
          type: array
          items:
            type: string
          example:
          - user_12345@ot.com
          - user_67890@ot.com
          - user_54321@ot.com
        primaryIdentifiers:
          description: A List of all identifiers that are primary identifiers. The members in this list need not be present in member identifiers list as they are mutually exclusive.
          type: array
          items:
            type: string
          example:
          - user_primary@ot.com
      required:
      - groupName
      - memberIdentifiers
      - primaryIdentifiers
  securitySchemes:
    ConsentPreferences-UniversalConsentPreferenceManag_OAUTH2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{hostname}/api/access/v1/oauth/token
          scopes:
            CONSENT: Consent Scope gives the user access to read/write operations
            CONSENT_READ: Consent Read Scope gives the user read-only access
    ConsentAPI_OAUTH2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{hostname}/api/access/v1/oauth/token
          scopes:
            CONSENT: Consent Scope gives the user access to read/write operations
            CONSENT_READ: Consent Read Scope gives the user read-only access
    DSPreferneceCache_OAUTH2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{hostname}/api/access/v1/oauth/token
          scopes:
            CONSENT: Consent Scope gives the user access to read/write operations
            CONSENT_READ: Consent Read Scope gives the user read-only access
