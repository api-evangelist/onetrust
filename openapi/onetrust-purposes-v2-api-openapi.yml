        languages:
          description: List of language-specific content for the topic
          type: array
          items:
            $ref: '#/components/schemas/ConsentPreferences-UniversalConsentPreferenceManag_TopicLanguageDtoV2_Simple'
        canDelete:
          description: Indicates whether this topic can be deleted
          type: boolean
          example: true
      required:
      - id
      - name
    ConsentPreferences-UniversalConsentPreferenceManag_TopicLanguageDtoV2_Simple:
      properties:
        name:
          type: string
        language:
          type: string
        default:
          type: boolean
    ConsentPreferences-UniversalConsentPreferenceManag_TopicLanguageDtoV2_Detail:
      properties:
        name:
          type: string
        language:
          type: string
        default:
          type: boolean
    ConsentPreferences-UniversalConsentPreferenceManag_PurposeCustomPreferenceDtoV2_Detail:
      properties:
        id:
          description: Unique identifier of the purpose-custom preference relationship
