components:
  schemas:
    ConsentAPI_DataSubjectDeleteRequestV4:
      type: object
      properties:
        identifier:
          description: The data subject identifier of the data subject.
          type: string
          example: user-12345@ot.com
        retainReceipts:
          description: This flag indicates whether receipts will be retained while deleting data subjects. When set to `false`, receipts are removed from the database and no longer appear in the OneTrust Platform UI. However, these receipts are not permanently deleted and can still be retrieved using the [Get List of Receipts API](https://developer.onetrust.com/onetrust/reference/getreceiptlistdetailsusingpost).
          type: boolean
          example: false
      required:
      - identifier
      - retainReceipts
    ConsentAPI_DataSubjectElementDto:
      type: object
      properties:
        name:
          description: The name of the data element.
          type: string
          example: Work Email
        value:
          description: The value of the data element.
          type: object
          example: example@otprivacy.com, [Red, Blue]
        linked:
          description: This flag indicates whether the data element is linked to the data subject.
          type: boolean
      required:
      - name
    ConsentAPI_PurposeNoteDto:
      type: object
      properties:
        noteId:
          description: Unique identifier for the purpose note
          type: string
          format: uuid
          example: d1a8f6f2-781a-4b2b-b1db-07e25f1c9a94
        noteType:
          description: Type of the note
          type: string
          enum:
          - UNSUBSCRIBE_REASON
        noteLanguage:
          description: Language of the purpose note
          type: string
          example: en-us
        noteText:
          description: The actual text of the note
          type: string
          example: 0e7ed8b7-a64d-4e38-a7ea-7c28dbdd5869
    ConsentAPI_EmailLinkTokenResponseDto:
      type: object
      properties:
        token:
          description: The data subject link token. This token can be appended to the preference center URL to form the preference center magic link.
          type: string
          example: QFpXYCFOYUrFZfstplM5l1hjdLv4YlaQtkbYt7gpZUc=
        identifier:
          description: The data subject identifier of the data subject.
          type: string
          example: example@otprivacy.com
        createdDate:
          description: The date and time that the data subject link token was created.
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000'
        expiryDate:
          description: The date and time that the data subject link token expires.
          type: string
          format: date-time
          example: '2024-02-01T00:00:00.000'
    ConsentAPI_DataSubjectProfileDto:
      type: object
      properties:
        language:
          description: The language set for the data subject.
          type: string
          example: en-us
        identifier:
          description: The data subject identifier of the data subject.
          type: string
          example: example@otprivacy.com
        linkToken:
          description: Token used for magic link authentication of the Data Subject
          type: string
          example: jNJW2e8vm8eWb6DlWyGbZ/7PsfC+AHFN8JqvZHPGzJQ=
        createdDate:
          description: The date and time that the data subject record was created.
          type: string
          format: date-time
          example: '2020-01-12T16:11:25.479Z'
        testDataSubject:
          description: This flag indicates whether the data subject is used for testing purposes.
          type: boolean
          example: true
        id:
          description: Unique Identifier identifying a Data Subject
          type: string
          format: uuid
          example: 633ba071-61b0-485f-81a0-a2245777b432
        lastUpdatedDate:
          description: The date that the Data Subject record was last updated on
          type: string
          format: date-time
          example: '2020-01-12T16:11:25.479Z'
        dataElements:
          description: The additional information about the data subject.
          type: array
          items:
            $ref: '#/components/schemas/ConsentAPI_DataSubjectElementDto'
        purposes:
          description: List of purposes associated with the Data Subject's profile
          type: array
          items:
            $ref: '#/components/schemas/ConsentAPI_DataSubjectProfilePurposeDto'
    ConsentAPI_DataSubjectProfileResponseDto:
      type: object
      properties:
        id:
          description: Unique Identifier identifying a Purpose
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        identifier:
          description: The data subject identifier of the data subject.
          type: string
          example: example@otprivacy.com
        lastReceiptId:
          description: Unique Identifier identifying a Receipt
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        name:
          description: The Purpose name
          type: string
          example: Marketing Communications
        version:
          description: Version of the Purpose
          type: integer
          format: int64
          example: 2
        status:
          description: The status of the purpose for the data subject.
          type: string
          example: ACTIVE
        firstTransactionDate:
          description: The date and time that the first transaction was written to the database.
          type: string
          format: date-time
          example: '2020-01-05T11:34:30.974Z'
        lastTransactionDate:
          description: The date and time that the last transaction was written to the database.
          type: string
          format: date-time
          example: '2020-01-12T16:11:25.479Z'
        withdrawalDate:
          description: The date and time that the data subject withdrew consent for the purpose.
          type: string
          format: date-time
          example: '2020-01-12T16:11:25.479Z'
        reactivationDate:
          description: Indicates the date and time on which a consent will be reactivated. This is set when a purpose is snoozed until the specified date and time. The consent remains snoozed until this date, after which it is automatically reactivated and becomes active again.
          type: string
          format: date-time
          example: '2020-06-12T16:11:25.479'
        consentDate:
          description: The date and time that the data subject gave their last active consent.
          type: string
          format: date-time
          example: '2020-01-07T13:18:23.123Z'
        expiryDate:
          description: The explicit expiration date after which the purpose is no longer valid and no further consent is collected against it.
          type: string
          format: date-time
          example: '2020-01-07T13:18:23.123Z'
        totalTransactionCount:
          description: The total number of Transactions recorded against this Purpose
          type: integer
          format: int64
          example: 3
        topicsList:
          description: The list of topics associated with the purpose.
          type: array
          items:
            type: string
            format: uuid
          writeOnly: true
        topics:
          description: The details of the topics for which transactions were recorded.
          type: array
          items:
            $ref: '#/components/schemas/ConsentAPI_DataSubjectProfileTopicResponseDto'
        customPreferencesMap:
          description: The list of purpose preferences associated with the purpose.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: uuid
          writeOnly: true
        customPreferences:
          description: The details of the purpose preferences for which transactions were recorded.
          type: array
          items:
            $ref: '#/components/schemas/ConsentAPI_DsProfileCustomPreferenceResponseDto'
        lastTransactionCollectionPointId:
          type: string
          format: uuid
        lastTransactionCollectionPointVersion:
          type: integer
          format: int64
        purposeNote:
          description: The details of the reason template used to explain changes to the data subject's preferences.
