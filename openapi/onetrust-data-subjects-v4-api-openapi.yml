  /rest/api/consent/v4/datasubjects/profiles:
    get:
      operationId: getDataSubjectProfilesV4
      summary: Get List of All Purpose Details for All Data Subjects
      description: 'Use this API to retrieve a list of all purpose details last updated between a specified date range for all data subjects.


        > 🗒 Things to Know

        >

        > - The maximum date range that can be returned is 30 days.

        > - Along with the mandatory date range filter parameters, this API supports the following filter combinations:

        > - `collectionPointId`, `purposeId`, and `status`

        > - `purposeId` and `status`

        > - `collectionPointId`'
      tags:
      - Data Subjects V4
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-universal-consent-preference-management-oas.json
      parameters:
      - name: collectionPointId
        in: query
        description: The unique identifier of the collection point.
        required: false
        schema:
          type: string
          format: uuid
        example: 25d9ccac-db88-4d34-849c-3d602a629961
      - name: purposeId
        in: query
        description: The unique identifier of the purpose.
        required: false
        schema:
          type: string
          format: uuid
        example: 25d9ccac-db88-4d34-849c-3d602a629961
      - name: status
        in: query
        description: The status of the purpose for the data subject.
        required: false
        schema:
          type: string
          enum:
          - EXPIRED
          - WITHDRAWN
          - NO_CONSENT
          - PENDING
          - ACTIVE
          - OPT_OUT
          - ALWAYS_ACTIVE
          - HARD_OPT_OUT
          - EXTEND
          - CHANGE_PREFERENCES
          - NOT_OPT_OUT
          - OPT_IN
          - IMPLICIT
        example: ACTIVE
      - name: updatedSince
        in: query
        description: The start of a date and time range used to filter results.
        required: true
        schema:
          type: string
          format: date-time
        example: '2024-01-01T00:00:00'
