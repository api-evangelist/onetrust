          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: string
        '403':
          description: Forbidden
        '404':
          description: Unable to find a datasubject with given identifier
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Missing identifier(or)additionalidentifier OR missing purposes in the request
