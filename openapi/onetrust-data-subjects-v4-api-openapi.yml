  /rest/api/consent/v4/datasubjects/unordered:
    get:
      operationId: getDataSubjectsUnorderedV4
      summary: Get Optimized List of Data Subjects
      description: 'Use this optimized for high-performance API to retrieve a list of unsorted data subjects that were last updated between the specified date range. The response includes key details such as each data subject’s identifier, created date, data elements, and last updated date.


        > 🗒 Things to Know

        >

        > - The maximum date range that can be returned is 7 days.

        > - Results are not returned in a specific order and may appear random.

        > - Supports bookmarking for consistent pagination.

        > - Optimized for high-performance bulk retrieval where sorting is not required.

        > - Has more flexible rate limits compared to the standard Get List of Data Subjects API.'
      tags:
      - Data Subjects V4
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-universal-consent-preference-management-oas.json
