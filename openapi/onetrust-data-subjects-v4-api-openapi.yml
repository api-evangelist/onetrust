      - ConsentAPI_OAUTH2:
        - CONSENT
  /rest/api/consent/v4/datasubjects:
    get:
      operationId: getDataSubjectsV4
      summary: Get List of Data Subjects
      description: 'Use this API to retrieve a list of data subjects that were last updated between the specified date range. The response will include basic details, such as each data subject’s identifier, created date, data elements, and last updated date.


        > 🗒 Things to Know

        >

        > - The maximum date range that can be returned is 7 days.'
      tags:
      - Data Subjects V4
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-universal-consent-preference-management-oas.json
      parameters:
      - name: fromDate
        in: query
        description: The start of a date and time range used to filter results.
        required: true
        schema:
          type: string
          format: date-time
        example: '2024-01-01T00:00:00'
      - name: toDate
        in: query
        description: The end of a date and time range used to filter results.
        required: true
        schema:
          type: string
          format: date-time
        example: '2024-01-07T23:59:59'
      - name: isDNCInclude
        in: query
        description: Indicates whether to include data subject in the response if the data subject is in the DNC list.
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: requestContinuation
        in: header
        description: The token used to paginate a response if the number of records is more than a page.
        required: false
        schema:
          type: string
        example: '{\"compositeToken\": \"jmxpAKZxe9nZkAoAAAAAAA==\"}'
      - name: page
        in: query
        description: The page number of the results.
        schema:
          type: integer
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: The sort criteria that dictates the order of the results.
        schema:
          type: string
          default: lastModifiedDate,desc
          enum:
          - lastModifiedDate,asc
          - lastModifiedDate,desc
        example: lastModifiedDate,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentAPI_DataSubjectResponseSliceDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - ConsentAPI_OAUTH2:
        - CONSENT
        - CONSENT_READ
