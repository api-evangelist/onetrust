  /rest/api/consent/v4/datasubjects/profiles/unordered:
    get:
      operationId: getDataSubjectProfilesUnorderedV4
      summary: Get Optimized List of All Purpose Details for All Data Subjects
      description: 'Use this API to retrieve an unordered list of all purpose details last updated between a specified date range for all data subjects.


        > 🗒 Things to Know

        >

        > - The maximum date range that can be returned is 30 days.

        > - Along with the mandatory date range filter parameters, this API supports the following filter combinations:

        > - `collectionPointId`, `purposeId`, and `status`

        > - `purposeId` and `status`

        > - `collectionPointId`

        > - This API is optimized for high-performance bulk retrieval where sorting is not required. Results are not returned in a specific order and may appear random. Bookmarking is supported for consistent pagination.

        > - This API has more flexible rate limits compared to the standard Get List of All Purpose Details for All Data Subjects API.'
      tags:
      - Data Subjects V4
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-universal-consent-preference-management-oas.json
      parameters:
      - name: collectionPointId
        in: query
        description: The unique identifier for a Collection Point.
        required: false
        schema:
          type: string
          format: uuid
        example: 8f5f3a5b-4b32-40d3-9c43-69c5ec91f4af
      - name: purposeId
        in: query
        description: The unique identifier for a Purpose.
        required: false
        schema:
          type: string
          format: uuid
        example: 25d9ccac-db88-4d34-849c-3d602a629961
      - name: status
        in: query
        description: The status of the Purpose for the data subject.
        required: false
        schema:
          type: string
          enum:
          - EXPIRED
          - WITHDRAWN
          - NO_CONSENT
          - PENDING
          - ACTIVE
          - OPT_OUT
          - ALWAYS_ACTIVE
          - HARD_OPT_OUT
          - EXTEND
          - CHANGE_PREFERENCES
          - NOT_OPT_OUT
          - OPT_IN
          - IMPLICIT
        example: ACTIVE
      - name: updatedSince
        in: query
        description: The start of a date and time range used to filter results.
        required: true
        schema:
          type: string
          format: date-time
        example: '2024-01-01T00:00:00'
      - name: updatedUntil
        in: query
        description: The end of a date and time range used to filter results.
        required: true
        schema:
          type: string
          format: date-time
        example: '2024-01-07T23:59:59'
      - name: requestContinuation
        in: header
        description: The token used to paginate a response if the number of records is more than a page.
        required: false
        schema:
          type: string
        example: '{\"compositeToken\": \"jmxpAKZxe9nZkAoAAAAAAA==\"}'
      - name: page
        in: query
        description: The page number of the results.
        schema:
          type: integer
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          type: integer
