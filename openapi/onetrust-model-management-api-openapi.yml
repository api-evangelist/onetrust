                        operator: EQUAL_TO
              Complex filters with multiple criteria:
                summary: Filtering with multiple criteria
                description: Complex filters with multiple criteria
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: generativeAI
                        value:
                        - de8c2b96-6393-42d3-bd0d-56c35cc18c7e
                        operator: EQUAL_TO
                      - field: modelVersion
                        value: '2.0'
                        operator: EQUAL_TO
              filter by createdBy equal to:
                summary: filter model by createdBy equal to
                description: filter by createdBy equal to
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: createdBy
                        value:
                        - 41955b71-e581-4187-ab6c-d00d1403350c
                        operator: EQUAL_TO
              filter by createdBy not equal to:
                summary: filter model by createdBy not equal to
                description: filter by createdBy not equal to
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: createdBy
                        value:
                        - 41955b71-e581-4187-ab6c-d00d1403350c
                        operator: NOT_EQUAL_TO
              filter by created Date and operator as between:
                summary: filter model by created Date and operator as between
                description: filter by created Date and operator as between
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: createdDate
                        value: '2025-06-06T18:30:00.000Z'
                        toValue: '2025-06-09T18:30:00.000Z'
                        operator: BETWEEN
              filter by created Date and operator as less than:
                summary: filter model by created Date and operator as less than
                description: filter by created Date and operator as less than
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: createdDate
                        value: '2025-06-08T18:30:00.000Z'
                        operator: LESS_THAN
              filter by created Date and operator as greater than:
                summary: filter model by created Date and operator as greater than
                description: filter by created Date and operator as greater than
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: createdDate
                        value: '2025-06-04T18:30:00.000Z'
                        operator: GREATER_THAN
              Filter by biases:
                summary: Filter by biases
                description: Filter by biases
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: biases
                        value: Biases check
                        operator: EQUAL_TO
      responses:
        '200':
          description: Successfully retrieved list of models matching criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEntityInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - object-manager
        - object-manager-read
        - object-manager-write
