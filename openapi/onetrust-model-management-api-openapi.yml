  /api/custom-entity/v2/models/basic-details/search:
    post:
      operationId: findModelBasicDetailsByQueryCriteriaUsingPOST
      summary: Get Basic Model Object Details
      description: 'Use this API to retrieve basic details for the specified Model object record by key terms and filters.


        > 🗒 Things to Know

        >

        > - This API only supports Model objects created via Object Manager.'
      tags:
      - Model Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: page
        in: query
        description: The page number of the results.
        schema:
          description: Results page to be retrieved (0..N). Example- '?page=1
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          description: Number of records per page (1..50). Example- '?size=20
          type: integer
          format: int32
          default: 10
          maximum: 2000
          minimum: 1
        example: 50
      - name: sort
        in: query
        description: The sort criteria that dictates the order of the results.
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
        example: name,asc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityQueryRequest'
            examples:
              Query by name pattern:
                summary: Query models with names starting with 'Customer'
                description: Query by name pattern
                value:
                  query: name:Customer*
              Query by version pattern:
                summary: Query models with version 2.x
                description: Query by version pattern
                value:
                  query: modelVersion:2.*
              Query by multiple fairness metrics:
                summary: Find models with specific fairness metric ranges
                description: Query by multiple fairness metrics
                value:
                  query: demographicParityRatio:[0.9 TO 1.0] AND equalizedOddsRatio:[0.85 TO 1.0]
              Query by model source and creation date:
                summary: Find models from specific sources created recently
                description: Query by model source and creation date
                value:
                  query: modelSource:("Internal Development" OR "Open Source") AND createdDate:[2025-01-01T00:00:00Z TO NOW]
              Query models with specific limitations or biases:
                summary: Find models that mention specific limitations in documentation
                description: Query models with specific limitations or biases
                value:
                  query: limitations:*language* OR biases:*cultural*
              Complex query with boolean logic:
                summary: Advanced query combining multiple conditions with boolean operators
                description: Complex query with boolean logic
                value:
                  query: (name:*Sentiment* OR name:*Classification*) AND modelVersion:2.* AND NOT modelSource:"Third Party" AND (hubReferenceId:SA-* OR hubReferenceId:CLS-*)
      responses:
        '200':
          description: Successfully retrieved list of basic model details matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEntityIdentifierInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - object-manager
        - object-manager-read
        - object-manager-write
