                  name: kyutai/mimi
                  description: Mimi is a high-fidelity audio codec leveraging neural networks.
                  referenceLink: https://huggingface.co/kyutai/mimi
                  biases: The model has been trained with a few safeguards to try to limit potential toxic usages.
                  limitations: The model has been trained with a few safeguards to try to limit potential toxic usages.
                  organization:
                    id: c9e5a35b-9be7-4dd6-adac-0bee7c02384f
                  entityDetail: []
              Comprehensive Model:
                summary: Detailed AI model creation example
                description: A comprehensive model creation request with fairness metrics
                value: "{\n \"name\": \"timm/mobilenetv3_small_100.lamb_in1k\",\n \"description\": \"A MobileNet-v3 image classification model.\",\n \"referenceLink\": \"https://huggingface.co/timm/mobilenetv3_small_100.lamb_in1k\"\n \"biases\": \"May have cultural bias based on training data\",\n \"limitations\": \"Requires high computational resources and may have latency issues for real-time processing\",\n \"demographicParityDifference\": \"0.05\",\n \"demographicParityRatio\": \"0.92\",\n \"equalizedOddsDifference\": \"0.07\",\n \"equalizedOddsRatio\": \"0.89\",\n \"modelVersion\": \"2.3.1\",\n \"additionalAttributes\": {\n \"generativeAI\": [{\n \"id\": \"de8c2b96-6393-42d3-bd0d-56c35cc18c7e\"\n }],\n \"framework\": [{\n \"id\": \"d1f9e973-8a10-4634-ac05-856ea71532e9\"\n }],\n \"hostingProvider\": [{\n \"id\": \"20841322-b61d-4b47-bfaf-f84d9699578a\"\n }],\n \"programmingLanguage\": [{\n \"id\": \"7d2d9553-677e-4902-94fc-3a56d2a14aeb\"\n }],\n \"typeofLearning\": [{\n \"id\": \"3c84bf17-5440-4010-ad8b-c721d9aa11c7\"\n }],\n \"taskType\": [{\n \"id\": \"55d5462e-58dc-4eb6-8e08-74aa0006b722\"\n }]\n },\n \"organization\": {\n \"id\": \"c9e5a35b-9be7-4dd6-adac-0bee7c02384f\"\n },\n \"entityDetail\": [{ \"owner\": \"41955b71-e581-4187-ab6c-d00d1403350c\"\n \"internalOrThirdParty\": \"da570b8b-6f52-4b67-b009-fd2e427da9ab\"\n }],\n}"
