        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityListRequest'
            examples:
              Filter by name:
                summary: Filter models by name
                description: Filter by name
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: name
                        value: DataRobot Model 15
                        operator: EQUAL_TO
              Filter by Autonomy Level:
                summary: Filter models by Autonomy Level
                description: Filter by Autonomy Level
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
