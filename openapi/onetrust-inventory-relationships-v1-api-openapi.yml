components:
  schemas:
    InventoryControlImplementationsRequest:
      type: object
      properties:
        controlIds:
          description: Set of control IDs to be implemented for the given inventory entity
          type: array
          items:
            type: string
            format: uuid
          example:
          - a8d2f0c6-63e5-476b-b600-79a447251a2a
          - b9e3f1d7-74f6-587c-c711-8ba558362b3b
          uniqueItems: true
        status:
          description: Implementation status of the controls being added to the inventory. If not provided, defaults to 'Pending'
          type: string
          example: Implemented
          enum:
          - Implemented
          - Not Implemented
          - Partially Implemented
          - Not Applicable
          - Pending
      required:
      - controlIds
    InventoryValue:
      type: object
      properties:
        id:
          description: Unique identifier of the inventory value
          type: string
          format: uuid
          example: 7e9d5f2a-8b1c-4d3e-9f6a-1a2b3c4d5e6f
        value:
          description: The display value
          type: string
          example: High Risk
        valueKey:
          description: The key of the value
          type: string
          example: HIGH_RISK
        colorCode:
          description: Color code associated with the value
          type: string
          example: '#FF0000'
        selectionValue:
          description: Selection value
          type: string
          example: high
    InventoryAssociationCreateRequest:
      type: object
      properties:
        relation:
          description: The type of relationship between inventory records
          type: string
          example: JointControllerLinkType
          enum:
          - ControllerLinkType
          - JointControllerLinkType
          - RelatedLinkType
          - RecipientOfSaleLinkType
          - SubProcessorLinkType
          - ProcessorLinkType
          - DestinationAccessLinkType
          - ProductOrServiceProviderLinkType
          - StorageProcessingLinkType
          - SourceCollectionLinkType
        id:
          description: The unique identifier of the inventory record to link to
          type: string
          format: uuid
          example: d31425ae-1321-4738-bb76-bdca83c0944c
        entityType:
          description: The type of the inventory entity
          type: string
          example: vendors
      required:
      - id
    PersonalDataLinkAttributesRequest:
      type: object
      properties:
        linkAttributes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/InventoryValue'
    InventoryAssociationRequest:
      type: object
      properties:
        relation:
          description: The type of relationship between inventory records
          type: string
          example: JointControllerLinkType
          enum:
          - ControllerLinkType
          - JointControllerLinkType
          - RelatedLinkType
          - RecipientOfSaleLinkType
          - SubProcessorLinkType
          - ProcessorLinkType
          - DestinationAccessLinkType
          - ProductOrServiceProviderLinkType
          - StorageProcessingLinkType
          - SourceCollectionLinkType
    PersonalDataLinkRequest:
      type: object
      properties:
        dataElement:
          description: Reference to the data element to link
          example:
            id: 11111111-1111-1111-1111-111111111111
            value: Email
            valueKey: email
          $ref: '#/components/schemas/ObjectReference'
        dataCategory:
          description: Reference to the data category to link
          example:
            id: 22222222-2222-2222-2222-222222222222
            value: Contact Info
            valueKey: contact_info
          $ref: '#/components/schemas/ObjectReference'
        dataSubjectType:
          description: Reference to the data subject type to link
          example:
            id: 33333333-3333-3333-3333-333333333333
            value: Customer
            valueKey: customer
          $ref: '#/components/schemas/ObjectReference'
        linkAttributes:
          description: Map of attribute names to their values for the link
          type: object
          example:
            priority:
            - id: 7e9d5f2a-8b1c-4d3e-9f6a-1a2b3c4d5e6f
              value: High Risk
              valueKey: HIGH_RISK
              colorCode: '#FF0000'
              selectionValue: high
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/InventoryValue'
        metadata:
          description: List of metadata for the personal data link
          type: array
          items:
            $ref: '#/components/schemas/PersonalDataMetadataRequest'
          example:
            fieldMetadataMapId: 123e4567-e89b-12d3-a456-426614174000
            fieldName: emailAddress
            basePath: /user/contact
            subPath: /email
            fieldType: String
            fieldValue: user@example.com
            fieldDescription: Primary email address of the user
            fieldLabel: Email Address
            systemType: CRM
            recordCount: 1500
            key: email_key
            metadataId: 987e6543-e21b-12d3-a456-426614174999
            dataSourceId: 456e7890-e12b-12d3-a456-426614174abc
        dataClassifications:
          description: List of data classifications for the personal data link
          type: array
          items:
            $ref: '#/components/schemas/ObjectReference'
          example:
          - id: 44444444-4444-4444-4444-444444444444
            value: Confidential
            valueKey: confidential
        associationId:
          description: The unique identifier of the association
          type: string
          format: uuid
          example: 4374d5da-44ac-4308-a298-3efdb0f34ba4
    InventoryAssociationUpdateRequest:
      type: object
      properties:
        relation:
          description: The type of relationship between inventory records
          type: string
          example: JointControllerLinkType
          enum:
          - ControllerLinkType
          - JointControllerLinkType
          - RelatedLinkType
          - RecipientOfSaleLinkType
          - SubProcessorLinkType
          - ProcessorLinkType
          - DestinationAccessLinkType
          - ProductOrServiceProviderLinkType
          - StorageProcessingLinkType
          - SourceCollectionLinkType
        InventoryType:
          type: string
          example: vendors
          enum:
          - processing-activities
          - vendors
          - assets
          - entities
        Ids:
          type: array
          items:
            type: string
            format: uuid
          example:
          - a1087fcb-1058-40ba-8c36-43dfafc0bba8
          - f9d7a8f1-af0d-418e-9092-e860307a48a3
      required:
      - Ids
      - InventoryType
    BaseInventoryAssociationDto:
      type: object
      properties:
        inventoryId:
          description: The unique identifier of the linked inventory record
          type: string
          format: uuid
          example: 9a7c3ec1-7830-4811-8563-36e0a093e7ae
        inventoryAssociationId:
          description: The unique identifier of the association between inventory records
          type: string
          format: uuid
          example: 4374d5da-44ac-4308-a298-3efdb0f34ba4
    InventoryAssociationRemoveRequest:
      type: object
      properties:
        inventoryAssociationId:
          description: The unique identifier of the association to remove
          type: string
          format: uuid
          example: d31425ae-1321-4738-bb76-bdca83c0944c
      required:
      - inventoryAssociationId
    ObjectReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
        valueKey:
          type: string
    PersonalDataMetadataRequest:
      type: object
      properties:
        fieldMetadataMapId:
          type: string
          format: uuid
        fieldName:
          type: string
        basePath:
          type: string
        subPath:
          type: string
        fieldType:
          type: string
        fieldValue:
          type: string
        fieldDescription:
          type: string
        fieldLabel:
          type: string
        systemType:
          type: string
        recordCount:
          type: integer
          format: int32
        key:
          type: string
        metadataId:
          type: string
          format: uuid
        dataSourceId:
          type: string
          format: uuid
      required:
      - fieldName
      - systemType
  securitySchemes:
    OAUTH2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{hostname}/api/access/v1/oauth/token
          scopes:
            INVENTORY: Inventory Scope gives the user access to read/write operations
            INVENTORY_READ: Inventory Read Scope gives the user read-only access
            INVENTORY_WRITE: Inventory Write Scope gives the user write access
