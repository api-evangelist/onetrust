openapi: 3.2.0
info:
  title: Consent & Preferences - Cookie Consent Scans API
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: The Cookie Consent APIs are used to integrate external systems and streamline the flow of data with Cookie Consent in the OneTrust Platform.
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Scans
  description: The Scans APIs are used to manage website cookie scanning operations and results.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
paths:
  /api/cmp/v1/webscans:
    get:
      operationId: getDomainsScannedBySort
      summary: Get List of Websites
      description: Use this API to retrieve a list of websites in the scanner. The response will return websites in Pending and Completed status for the organization and related child organizations.
      tags:
      - Scans
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
      parameters:
      - name: searchStr
        in: query
        description: The search term used to filter results.
        required: false
        schema:
          type: string
          maxLength: 255
        example: domain.com
      - name: externalOrgId
        in: query
        description: The external organization identifier.
        required: false
        schema:
          type: string
          maxLength: 100
        example: orgnameid
      - name: page
        in: query
        description: The page number for pagination results, starting from 0.
        required: false
        schema:
          type: integer
          example: 1
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The number of items to return per page.
        required: false
        schema:
          type: integer
          example: 10
          default: 10
          maximum: 100
          minimum: 1
      - name: sortBy
        in: query
        description: The field by which to sort the results.
        required: false
        schema:
          type: string
          enum:
          - Url
          - PagesScanned
          - TotalCookieCount
          - LastScannedDate
          - ConsentPolicyName
          - ScheduledNextScanDate
          - MaxPagesScanned
        example: Url
      - name: direction
        in: query
        description: The sort order for results, either ascending or descending.
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        example: DESC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposedScanWebsitePageResponseDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
        - COOKIE_READ
    post:
      operationId: addScans
      summary: Scan Websites
      description: Use this API to start scans for the specified domains.
      tags:
      - Scans
