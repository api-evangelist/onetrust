          type: string
          maxLength: 100
        example: orgnameid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ScanWebsiteRequest'
              uniqueItems: true
      responses:
        '200':
          description: OK
          content:
            application/json:
