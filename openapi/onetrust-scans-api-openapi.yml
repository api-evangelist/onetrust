components:
  schemas:
    ScanDeltaDetails:
      type: object
      properties:
        addedCookies:
          description: The cookies that were newly added.
          type: array
          items:
            $ref: '#/components/schemas/CookieInformation'
          example:
          - cookieId: f2229953-b4b5-4042-8cb9-b78038cc4c46
            cookieName: session_id
            host: example.com
          maxItems: 1000
          minItems: 0
        removedCookies:
          description: The cookies that were removed or deleted.
          type: array
          items:
            $ref: '#/components/schemas/CookieInformation'
          example:
          - cookieId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            cookieName: old_cookie
            host: test.com
          maxItems: 1000
          minItems: 0
        scanDeltaMetadata:
          description: The metadata information about changes between scans.
          $ref: '#/components/schemas/ScanDeltaMetadataDto'
    StorageEntriesDto:
      type: object
      properties:
        host:
          description: Storage entry host
          type: string
          example: https://abcnews.go.com
        key:
          description: Storage entry key
          type: string
          example: abcnews314-volume
        value:
          description: Storage entry value
          type: string
        type:
          description: Storage entry type. Can be 1 or 2 (local or session)
          type: integer
          format: int32
          example: abcnews314-volume
    TagDto:
      type: object
      properties:
        id:
          description: Tag identifier
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        host:
          description: Tag host
          type: string
          example: abcnews.com
        tagType:
          description: Tag type
          type: string
          example: Script
        src:
          description: Tag source url
          type: string
          example: Script
        params:
          description: Tag parameters.
          type: string
          example: (720px 893px)
        createdDate:
          description: Date when the tag was created.
          type: string
          format: date-time
          example: '2025-04-25T12:34:32Z'
        status:
          description: Tag status. Can be 1 or 2 (new or not found)
          type: integer
          format: int32
          example: Script
        age:
          description: How many days the tag is old.
