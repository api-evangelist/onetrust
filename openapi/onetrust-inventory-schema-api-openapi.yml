openapi: 3.2.0
info:
  title: Onetrust Inventory Schema API
  version: '1.0'
  description: 'Operations tagged Inventory Schema across 2 of this provider''s published API definitions: onetrust-privacy-automation-data-mapping-automation-openapi.json, onetrust-privacy-automation-data-mapping-automation-swagger-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
- url: https://customer.my.onetrust.com/api
tags:
- name: Inventory Schema
  description: APIs used to define and maintain schema attributes that shape inventory data collection and validation.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
paths:
  /api/inventory/v2/schemas:
    get:
      operationId: getAllSchemasUsingGET
      summary: Get List of Inventory Schemas
      description: Use this API to retrieve the list of schemas.
      tags:
      - Inventory Schema
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaSummaryDto'
              example:
              - id: data-elements
                name: DataElements
                description: DataElementsInventory
                nameKey: DataElements
                uri: /api/inventory/v2/data-elements
              - id: processing-activities
                name: ProcessingActivities
                description: ProcessingActivitiesInventory
                nameKey: ProcessingActivities
                uri: /api/inventory/v2/inventories/processing-activities
              - id: assets
                name: Assets
                description: AssetsInventory
                nameKey: Assets
                uri: /api/inventory/v2/inventories/assets
              - id: vendors
                name: Vendors
                description: VendorInventory
                nameKey: Vendors
                uri: /api/inventory/v2/inventories/vendors
              - id: entities
                name: Entities
                description: LegalEntitiesInventory
                nameKey: Entities
                uri: /api/inventory/v2/inventories/entities
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - INVENTORY
        - INVENTORY_READ
        - INVENTORY_WRITE
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /api/inventory/v2/schemas/attributes/{attributeId}/values/bulk/:
    post:
      operationId: createAttributeValuesForAnAttribute
      summary: Create Attribute Values
      description: 'Use this API to create attribute values for an attribute.


        > 🗒 Things to Know

        >

        > - This API only supports the creation of attribute options for the attributes with single/multi select response type and non user/location/date attribute type.'
      tags:
      - Inventory Schema
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
      parameters:
      - name: attributeId
        in: path
        description: ID of an attribute. The value is obtained using Get Inventory Schema API.
        required: true
        schema:
          type: string
          format: uuid
        example: 43fd3a8d-3f6b-464e-bf43-3f0c6c592442
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AttributeValueCreateRequest'
            example:
            - value: Option 1
              description: First option
              enabled: true
            - value: Option 2
              description: Second option
              enabled: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeValueResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - INVENTORY
        - INVENTORY_WRITE
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /api/inventory/v2/schemas/attributes/{attributeId}/values/{valueId}:
    put:
      operationId: manageAttributeOptions
      summary: Manage Attribute Options
      description: 'Use this API to manage attribute options in the assessment questions and inventories.


        > 🗒 Things to Know

        >

        > - This API supports deactivating/activating attribute options.

        > - This API can also be used for editing option names.'
      tags:
      - Inventory Schema
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
      parameters:
      - name: attributeId
        in: path
        description: ID of an attribute. The value is obtained using Get Inventory Schema API.
        required: true
        schema:
          type: string
          format: uuid
        example: bcb8c972-cd10-4c2a-9289-44f8cc78ac03
      - name: valueId
        in: path
        description: ID of the attribute value to update
        required: true
        schema:
          type: string
          format: uuid
        example: 91e37a36-ca61-499b-b3c3-7d556aef5cde
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeValueUpdateRequest'
            example:
              value: Updated Option
              description: Updated description
              enabled: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeValueResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - INVENTORY
        - INVENTORY_WRITE
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /api/inventory/v2/schemas/{schemaName}:
