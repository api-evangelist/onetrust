        in: path
        description: The `name` property of the schema. The value can be obtained using the [Get Schemas](/onetrust/reference/getSchemas) API.
        required: true
        schema:
          type: string
          enum:
          - processing-activities
          - vendors
          - assets
          - entities
      - name: showAll
        in: query
        description: If `showAll` is included in the query, non-hidden attributes will be returned regardless of their enabled state.
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: includeHidden
        in: query
        description: Determines if hidden attributes are returned or omitted.
        required: false
        schema:
          type: boolean
          default: false
          enum:
          - 'true'
          - 'false'
      - name: includePersonalData
