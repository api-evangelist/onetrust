            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-Risk_OAUTH2:
        - INTEGRATION
        - RISK
components:
  schemas:
    TechRiskCompliance-Risk_InventoryInformation:
      type: object
      properties:
        inventoryId:
          description: Unique Identifier of the Inventory
          type: string
          format: uuid
          example: 57a87cd3-0a1f-4439-bd5b-917e1d23eb5c
        inventoryName:
          description: Name of the Inventory
          type: string
          example: Raw Materials Inventory
          maxLength: 2000
        inventoryType:
          description: Type of the Inventory
          type: string
          example: VENDORS
          enum:
          - ASSETS
          - PROCESSING_ACTIVITIES
          - VENDORS
          - ENTITIES
          deprecated: true
        sourceType:
          description: Type of Inventory
          $ref: '#/components/schemas/TechRiskCompliance-Risk_EntityTypeInformation'
        softInherited:
          description: Soft Inherited flag
          type: boolean
          example: true
        organizationId:
          description: Unique Identifier of the organization
          type: string
          format: uuid
          example: f8583fd1-21cb-4c7c-a337-2982246418e5
    TechRiskCompliance-Risk_RiskApproverUpdateRequest:
      type: object
      properties:
        riskApprovers:
          description: List of risk approvers
          type: array
          items:
            $ref: '#/components/schemas/TechRiskCompliance-Risk_BasicEntityDetail'
          example:
          - id: 1c412288-b9fa-4fd6-98be-467b2824d33a
            name: Maya Mohan
        jsonAnyProperties:
          type: object
          additionalProperties:
            type: object
    TechRiskCompliance-Risk_BasicEntityDetail:
      type: object
      properties:
        id:
          description: Unique Identifier for the Entity
          type: string
          format: uuid
          example: e549ec16-b42a-4612-a402-3fcce7cc5f78
        name:
          description: Name for the Entity
          type: string
          example: Acme Corp, John Doe
          maxLength: 300
    TechRiskCompliance-Risk_EntityTypeInformation:
      type: object
      properties:
        id:
          description: Entity Type ID. This can be Assets, Entities, PIA, Engagement, Custom Object GUID in form of String.
          type: string
          example: 3f99b4ac-7c66-45b6-8ff4-63a67a3ec7be
        label:
          description: Entity Type Name
          type: string
          example: Inventory
          maxLength: 512
        translationKey:
          description: Translation Key of Entity Type ID
          type: string
          example: OBJ.Objective
          maxLength: 255
        seeded:
          description: For Base Entity Type Seeded is true and false for Custom Object/Entity Types by default.
          type: boolean
          example: false
        sourceType:
          description: Indicates whether this type can be source type or not in Risk
          type: boolean
          example: false
        riskType:
          description: Indicates whether this type can be risk type or not in Risk
          type: boolean
          example: true
        eligibleForEntityLink:
          description: Indicates whether entity type is eligible for linking/relating with risk or not
          type: boolean
          example: false
        enabled:
          description: Indicates whether the entity type is enabled or not.
          type: boolean
          example: false
        moduleName:
          description: Name of the module
          type: string
          example: Objective
          maxLength: 255
      required:
      - id
    TechRiskCompliance-Risk_RiskReferenceInformation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - ASSESSMENT
          - INVENTORY
          - INCIDENT
          - ENGAGEMENT
          - GENERIC
          deprecated: true
        referenceType:
          $ref: '#/components/schemas/TechRiskCompliance-Risk_EntityTypeInformation'
        name:
          type: string
        additionalAttributes:
          type: object
          additionalProperties:
            type: object
    TechRiskCompliance-Risk_BasicStageApproverDetails:
      type: object
      properties:
        id:
          description: UUID of the user
          type: string
          format: uuid
          example: 3f99b4ac-7c66-45b6-8ff4-63a67a3ec7be
        firstName:
          description: first Name of the user
          type: string
          example: John
          maxLength: 100
        lastName:
          description: last name of the user
          type: string
          example: Doe
          maxLength: 100
        approvedTimeStamp:
          description: time stamp when the stage was approved
          type: string
          format: date-time
          example: 32025-07-12T14:52:30.123Z
        status:
          description: status of the review
          type: string
          example: Accepted
    TechRiskCompliance-Risk_RiskCategoryInformation:
      type: object
      properties:
        id:
          description: Risk Category unique identifier
          type: string
          format: uuid
          example: 46c58be9-4ab9-42ca-8f49-29fec6a5fb6e
        name:
          description: Risk Category name
          type: string
          example: Financial
          maxLength: 100
        nameKey:
          description: Risk Category nameKey for localization support
          type: string
          example: RiskCategory.Financial
          maxLength: 100
        seeded:
          description: Seeded category
          type: boolean
          example: false
    TechRiskCompliance-Risk_WorkflowStageNavigationInstructionInformation:
      type: object
      properties:
        nextStageId:
          description: Next stage ID - Only required if the navigation direction is Specific
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        direction:
          description: Navigation direction
          type: string
          example: Next
          enum:
          - First
          - Next
          - Previous
          - Last
          - Specific
        parameters:
          description: Additional parameters for workflow navigation customization
          additionalProperties:
            type: object
          example:
            skipValidation: true
            forceTransition: false
            notifyUsers: true
          type: object
        comment:
          description: Comment describing the stage change
          type: string
          example: Moving to investigation stage due to new evidence
          maxLength: 4000
          minLength: 0
      example:
        nextStageId: 123e4567-e89b-12d3-a456-426614174000
        direction: Specific
        parameters:
          forceTransition: false
          notifyUsers: true
          reason: Security incident triage complete
          skipValidation: true
          urgency: high
        comment: Moving to investigation stage due to new evidence found during initial triage
      required:
      - direction
    TechRiskCompliance-Risk_BasicEntityDetailTranslation:
      type: object
      properties:
        id:
          description: Unique Identifier for the Entity
          type: string
          format: uuid
          example: e549ec16-b42a-4612-a402-3fcce7cc5f78
        name:
          description: Name for the Entity
          type: string
          example: Acme Corp, John Doe
          maxLength: 300
        nameKey:
          description: Name key for entity detail translation
          type: string
          example: entity.detail
          maxLength: 255
        badgeColor:
          description: Badge Color of the Entity
          type: string
          example: New
          maxLength: 50
    TechRiskCompliance-Risk_RiskLevelDetails:
      type: object
      properties:
        levelId:
          description: Risk level identifier
          type: integer
          format: int64
        level:
          description: Risk level name
          type: string
        impactLevelId:
          description: Impact level identifier
          type: integer
          format: int64
        impactLevel:
          description: Impact level name
          type: string
        probabilityLevelId:
          description: Probability level identifier
          type: integer
          format: int64
        probabilityLevel:
          description: Probability level name
          type: string
        riskScore:
          description: Calculated risk score
          type: number
        levelGuid:
          description: Risk level unique identifier
          type: string
          format: uuid
        levelKey:
          description: Risk level key
          type: string
        colorCode:
          description: Risk level color code
          type: string
        impactLevelGuid:
          description: Impact level unique identifier
          type: string
          format: uuid
        impactLevelKey:
          description: Impact level key
          type: string
        probabilityLevelGuid:
          description: Probability level unique identifier
          type: string
          format: uuid
        probabilityLevelKey:
          description: Probability level key
          type: string
    TechRiskCompliance-Risk_BasicStageDetailTranslation:
      type: object
      properties:
        id:
          description: Unique Identifier for the Entity
          type: string
          format: uuid
          example: e549ec16-b42a-4612-a402-3fcce7cc5f78
        name:
          description: Name for the Entity
          type: string
          example: Acme Corp, John Doe
          maxLength: 300
        currentStageApprovers:
          type: array
          items:
            $ref: '#/components/schemas/TechRiskCompliance-Risk_BasicStageApproverDetails'
          uniqueItems: true
        nameKey:
          description: Name key for entity detail translation
          type: string
          example: entity.detail
          maxLength: 300
