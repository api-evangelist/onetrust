          type: string
          example: com.google.firebase
        sdkName:
          description: Display name of the SDK that triggered this mismatch
          type: string
          example: Firebase
        dataType:
          description: The Privacy Manifest data type this mismatch relates to
          type: string
          example: DEVICE_ID
          enum:
          - NAME
          - EMAIL
          - PHONE_NUMBER
          - PHYSICAL_ADDRESS
          - OTHER_USER_CONTACT_INFO
          - HEALTH
          - FITNESS
          - PAYMENT_INFO
          - CREDIT_INFO
          - OTHER_FINANCIAL_INFO
          - PRECISE_LOCATION
          - COARSE_LOCATION
          - SENSITIVE_INFO
          - CONTACTS
          - MESSAGES
          - PHOTOS_VIDEOS
          - AUDIO_DATA
          - GAMEPLAY_CONTENT
          - CUSTOMER_SUPPORT
          - OTHER_USER_CONTENT
          - BROWSING_HISTORY
          - SEARCH_HISTORY
          - USER_ID
          - DEVICE_ID
          - PURCHASE_HISTORY
          - PRODUCT_INTERACTION
          - ADVERTISING_DATA
          - OTHER_USAGE_DATA
          - CRASH_DATA
          - PERFORMANCE_DATA
          - OTHER_DIAGNOSTIC_DATA
          - ENVIRONMENT_SCANNING
          - HANDS
          - HEAD
          - OTHER_DATA_TYPES
          - UNKNOWN
