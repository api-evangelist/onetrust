          type: integer
          format: int32
          example: 3
        countMismatched:
          description: Number of data types with at least one non-DATA_TYPE mismatch
          type: integer
          format: int32
          example: 1
        countMissing:
          description: Number of data types missing from the Privacy Manifest declaration
          type: integer
          format: int32
