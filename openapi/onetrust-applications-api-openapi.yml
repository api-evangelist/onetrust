            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
  /api/cmp/v1/applications/{id}/scans:
    get:
      operationId: getScans
      summary: Get List of Application Scans
      description: Use this API to retrieve a paginated list of scans associated with a specific application. The response includes each scan's ID, status, and summary data for detected SDKs and permissions.
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        description: Unique identifier of the application to retrieve scans for
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: sortBy
        in: query
        description: Field to sort by
        required: false
        schema:
          type: string
          default: scanDate
          enum:
          - status
          - scanDate
          - engineVersion
        example: scanDate
      - name: direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
        example: desc
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
        example: 1
      - name: pageSize
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          default: 10
          maximum: 100
          minimum: 1
        example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageApplicationScanDetailDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE_READ
  /api/cmp/v1/applications/{id}/scans/{scanId}:
    get:
      operationId: getSingleScan
      summary: Get Application Scan
      description: Use this API to retrieve the details of a single scan for a specific application. The response includes the scan's ID, status, date, and summary data for detected SDKs and permissions.
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        description: Unique identifier of the application.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: scanId
        in: path
        description: Unique identifier the scan.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationScanDetailDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
