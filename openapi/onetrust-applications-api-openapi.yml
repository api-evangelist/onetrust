        consentPolicyName:
          description: Name of the assigned consent policy
          type: string
          example: GDPR Policy
          maxLength: 255
          minLength: 1
        consentPolicyAssignDate:
          description: Date when consent policy was assigned
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
        orgId:
          description: Organization ID that owns this application
          type: string
          example: org-123
        orgName:
          description: Organization name
          type: string
          example: OneTrust
          maxLength: 255
          minLength: 1
        scriptVersion:
          description: Script version
          type: string
          example: 202603.1.0
          maxLength: 100
        createdDate:
          description: Date when the application was created
          type: string
          format: date-time
          example: '2024-01-01T10:00:00Z'
        modifiedDate:
          description: Date when the application was last modified
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
        publishedDate:
          description: Date when the application was last published
          type: string
          format: date-time
          example: '2024-01-10T10:00:00Z'
    AppPrivacyManifestResponsePublicDto:
      type: object
      properties:
        editVersion:
