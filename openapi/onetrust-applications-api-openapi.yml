      parameters:
      - name: id
        in: path
        description: Unique identifier of the application.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: scanId
        in: path
        description: Unique identifier the scan.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationScanPermissionPublicDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
