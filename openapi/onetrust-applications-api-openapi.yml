        - COOKIE_READ
  /api/cmp/v1/applications/{id}/scans/{scanId}/privacy-manifest:
    get:
      operationId: getAppPrivacyManifest
      summary: Get Scan Privacy Manifest
      description: Use this API to retrieve a summary of the iOS privacy manifest analysis for a specific application scan. The response includes the manifest's edit version, supported versions, total data type count, and counts broken down by alignment status. Each data type entry includes the data type identifier, the number of SDKs associated with it, declared purposes, and any detected mismatches.\\n> \ud83d\uddd2 Things to Know\\n> \\n> - This endpoint is specific to iOS applications.
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        description: Unique identifier of the application.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: scanId
        in: path
        description: Unique identifier of the scan.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: version
        in: query
        description: Published version string of the privacy manifest to retrieve.If omitted, the latest version is used.
        required: false
        schema:
          type: string
        example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPrivacyManifestResponsePublicDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE_READ
  /api/cmp/v1/applications/{id}/scans/{scanId}/privacy-manifest/{dataType}:
    get:
      operationId: getAppPrivacyManifestDatatype
      summary: Get Privacy Manifest Data Type
      description: Use this API to retrieve detailed mismatch information for a specific data type within an iOS privacy manifest scan. The response includes a breakdown of mismatches by category, with each mismatch entry identifying the SDK package, SDK name, and the differing app and SDK values.\\n> \ud83d\uddd2 Things to Know\\n> \\n> - This endpoint is specific to iOS applications.\\n> - The `dataType` path parameter corresponds to a `dataType` returned in the Get Scan Privacy Manifest API response (e.g., `USER_ID`, `OTHER_DIAGNOSTIC_DATA`).\\n> - Mismatch categories with no detected issues return an empty array rather than being omitted from the response.
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        description: Unique identifier of the application.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: scanId
        in: path
        description: Unique identifier of the scan.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: dataType
        in: path
        description: App Privacy Manifest data type to retrieve. Must be a valid AppPrivacyManifestDataType enum name (case-insensitive).
        required: true
        schema:
          type: string
          enum:
          - NAME
          - EMAIL
          - PHONE_NUMBER
          - PHYSICAL_ADDRESS
          - OTHER_USER_CONTACT_INFO
          - HEALTH
          - FITNESS
          - PAYMENT_INFO
          - CREDIT_INFO
          - OTHER_FINANCIAL_INFO
          - PRECISE_LOCATION
          - COARSE_LOCATION
          - SENSITIVE_INFO
          - CONTACTS
          - MESSAGES
          - PHOTOS_VIDEOS
          - AUDIO_DATA
          - GAMEPLAY_CONTENT
          - CUSTOMER_SUPPORT
          - OTHER_USER_CONTENT
          - BROWSING_HISTORY
          - SEARCH_HISTORY
          - USER_ID
          - DEVICE_ID
          - PURCHASE_HISTORY
          - PRODUCT_INTERACTION
          - ADVERTISING_DATA
          - OTHER_USAGE_DATA
          - CRASH_DATA
          - PERFORMANCE_DATA
          - OTHER_DIAGNOSTIC_DATA
          - ENVIRONMENT_SCANNING
          - HANDS
          - HEAD
          - OTHER_DATA_TYPES
          - UNKNOWN
        example: DEVICE_ID
      - name: version
        in: query
        description: Published version string of the privacy manifest to retrieve. If omitted, the latest version is used.
        required: false
        schema:
          type: string
        example: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPrivacyManifestResponseDatatypePublicDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE_READ
  /api/cmp/v1/applications/{id}/scans/{scanId}/sdks:
    get:
      operationId: getScanSdks
      summary: Get List of Scan SDKs
      description: Use this API to retrieve a paginated list of SDKs detected during a specific application scan. The response includes each SDK's ID, name, vendor, and default category. Results can be filtered and sorted using optional query parameters for name, vendor, default category, and the package ID.\\n> \ud83d\uddd2 Things to Know\\n> \\n> - SDKs returned by this endpoint are scan-detected SDKs and are different from Tracking Technology SDKs, which have custom descriptions and categories.
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        description: Unique identifier of the application.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: scanId
        in: path
        description: Unique identifier the scan.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      - name: sortBy
        in: query
        description: Field to sort by
        required: false
        schema:
          type: string
          default: name
          enum:
          - pkgId
          - name
          - category
          - vendor
        example: name
      - name: direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
        example: desc
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          example: 1
          default: 0
          minimum: 0
      - name: pageSize
        in: query
        description: Page size
        required: false
        schema:
