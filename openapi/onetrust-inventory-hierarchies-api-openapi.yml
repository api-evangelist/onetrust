  /api/inventory/v2/inventory-hierarchies/{rootInventoryId}:
    get:
      operationId: getHierarchyForInventoryIdUsingGET
      summary: Get List of Child Inventories by Root Inventory
      description: Use this API to provide a paginated list of Child Inventories for a given Inventory Schema Type and a Root Inventory Id.
      tags:
      - Inventory Hierarchies
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
      parameters:
      - name: rootInventoryId
        in: path
        description: The unique identifier of the root inventory
        required: true
        schema:
          type: string
          format: uuid
        example: 96214230-ffbb-4870-b6c4-0f30c3bfec60
      - name: inventoryType
        in: query
        description: The type of inventory (e.g., assets, vendors, processing-activities, legal-entities)
        required: true
        schema:
          type: string
          enum:
          - processing-activities
          - vendors
          - assets
          - entities
        example: assets
      - name: page
        in: query
        description: Results page to be retrieved (0..N)
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Number of records per page (1..50)
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending'
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
          - createdDate,asc
          - createdDate,desc
        example: name,asc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
