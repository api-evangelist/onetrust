    DataUseGovernance-DataDiscoveryCustomClassiferMana_CustomDetectorDto:
      type: object
      properties:
        name:
          description: The name of the classifier.
          type: string
          example: Employee Id
          maxLength: 100
          minLength: 1
          pattern: ^(?=.*[a-zA-Z0-9])[a-zA-Z0-9_.\- '\(\)]+$
        description:
          description: The description of the classifier.
          type: string
          example: Find Employee ID
        isPII:
          description: This flag indicates whether the classifier contains personally identifiable information.
          type: boolean
          example: false
        definition:
          description: The technical definition of the classifier.
          example:
            detections:
            - name: '9 digit Employee ID '
              type: PATTERN
              pattern:
                regex: (?:^|\b)\d{9}(?:\b|$)
                flags: gm
              likelihood: POSSIBLE
            - name: Known Short Special Employee ID
              type: DICTIONARY
              dictionary:
                terms:
                - '00001'
                - '10000'
                ignoreCase: true
              likelihood: POSSIBLE
            detectionRules:
            - type: PATTERN
              name: Invalid Column Name
              inverse: false
              target: COLUMN_NAME
              includeExpand: false
              likelihoodAdjustment:
                type: SET
                setLikelihood: NO_MATCH
              pattern:
                regex: license|key|code|security|passport|password|url|token
                flags: mi
            - type: PATTERN
              name: Boost Likelihood for IDs Do Not Start with 123 (Example of Using Inverse)
              inverse: true
              target: FINDING
              includeExpand: false
              likelihoodAdjustment:
                type: ADJUST
                adjustLikelihood: 1
              pattern:
                regex: ^123
                flags: mi
            - type: PATTERN
              name: Append 4 Digit Extension If Found (Example of Using includeExpand)
              inverse: false
              target: FINDING
              includeExpand: true
              likelihoodAdjustment:
                type: ADJUST
                adjustLikelihood: 0
              pattern:
                regex: ^[-_+][0-9]{4}
                flags: mi
            - name: Deny List Context
              type: DICTIONARY
              target: CONTEXT
              dictionary:
                ignoreCase: true
                terms:
                - telefon
                - telefax
                - telex
                - telephone
              context:
                windowBefore: 15
                windowAfter: 15
              likelihoodAdjustment:
                type: SET
                setLikelihood: VERY_UNLIKELY
            - name: Matches Context For Employee ID
              type: DICTIONARY
              target: CONTEXT
              dictionary:
                ignoreCase: true
                terms:
                - Employee ID
                - Employee Identification
              context:
                windowBefore: 10
                windowAfter: 10
              likelihoodAdjustment:
                type: ADJUST
                adjustLikelihood: 1
            - name: Matches Term Object Name (File/Column Name)
              type: DICTIONARY
              dictionary:
                terms:
                - Employee
                - Employee_Id
                ignoreCase: true
              target: OBJECT_NAME
              likelihoodAdjustment:
                type: SET
                setLikelihood: VERY_LIKELY
          $ref: '#/components/schemas/DataUseGovernance-DataDiscoveryCustomClassiferMana_DetectorDefinition'
        glossaryTerm:
          description: The glossary term associated with the classifier.
          $ref: '#/components/schemas/DataUseGovernance-DataDiscoveryCustomClassiferMana_GlossaryTermDto'
        detectorVersion:
          description: The version number of the detector used by the classifier.
          type: integer
          format: int64
          example: 1
          readOnly: true
        id:
          description: The unique identifier of the classifier.
          type: string
          format: uuid
          example: a997fe47-a504-4dd4-8eda-52add1a397f0
          readOnly: true
        code:
          description: The system-generated code of the classifier.
          type: string
          readOnly: true
        custom:
          description: This flag indicates whether the classifier is custom-created.
          type: boolean
          example: false
          readOnly: true
        enabled:
          description: This flag indicates whether the classifier is active.
          type: boolean
          example: true
          readOnly: true
        surrogateType:
          description: The surrogate type associated with the classifier.
          type: string
          readOnly: true
        detectorType:
          description: The type of detector used by the classifier to classify data.
          type: string
          example: DICTIONARY
          enum:
          - PATTERN
          - DICTIONARY
          - SURROGATE
          - VALIDATOR
          - TEMPLATE
          - COMPLEX
          readOnly: true
        isGlossaryTermChanged:
          description: This flag indicates whether the glossary term association has changed.
          type: boolean
          example: false
          readOnly: true
        lastModifiedDate:
          description: The date and time when the classifier was last modified.
          type: string
          format: date-time
          example: '2024-04-04T11:33:16.538+00:00'
          readOnly: true
        createdDate:
          description: The date and time when the classifier was created.
          type: string
          format: date-time
          example: '2024-04-04T11:33:16.538+00:00'
          readOnly: true
        createdBy:
          description: The unique identifier of the user that created the classifier.
          type: string
          format: uuid
          example: a897fe47-a504-4dd4-8eda-52add1a397f1
          readOnly: true
        lastModifiedBy:
          description: The unique identifier of the user that last modified the classifier.
          type: string
          format: uuid
          example: e897fe47-a504-4dd4-8eda-52add1a397f0
          readOnly: true
        version:
          description: The version number used for optimistic locking.
          type: integer
          format: int64
          example: 1
          readOnly: true
      required:
      - definition
      - isPII
      - name
