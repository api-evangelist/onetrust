components:
  schemas:
    EntityTypeUpdateRequest:
      type: object
      properties:
        name:
          description: The name of the object type.
          type: string
          example: Vendor
        description:
          description: The description of the object type.
          type: string
          example: Module.VendorsNameKey
        moduleScopes:
          description: The product scopes of the object type.
          type: array
          items:
            type: string
          example:
          - Inventory
          - VRM
          - Assessments
          - IssueManagement
          enum:
          - Inventory
          - VRM
          - Assessments
          - IssueManagement
          - CustomEntityManagement
          - Control
          uniqueItems: true
        settings:
          description: The settings details of the object type.
          example:
            enableWorkflow: true
            assessable: true
          $ref: '#/components/schemas/EntityTypeSettingRequest'
        workflow:
          description: The details of the workflow.
          example:
            name: Vendor On-Boarding Workflow
            description: Vendor On-Boarding Workflow
            stages:
            - name: Start
            - name: End
          $ref: '#/components/schemas/EntityDefaultWorkflowRequest'
