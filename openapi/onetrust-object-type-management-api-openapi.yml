openapi: 3.2.0
info:
  title: Platform - Object Manager Object Type Management API
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: The Object Manager APIs are used to integrate external systems and streamline the flow of data for objects created via Object Manager in the OneTrust Platform.
servers:
- url: https://{hostname}/api/custom-entity
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Object Type Management
  description: The Object Type Management APIs are used to manage custom object types.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
paths:
  /v1/entity-types/names/{entityTypeName}:
    get:
      operationId: getEntityTypeInformationUsingGET_1
      summary: Get Object Type by Name
      description: 'Use this API to retrieve details for the object type by its name. The response will return the user who created the object type, created date, and description.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Type Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: entityTypeName
        in: path
        description: The name of the object type.
        required: true
        schema:
          description: Name of the object type to retrieve. Can be used instead of entityTypeId.
          type: string
        example: projects
      responses:
        '200':
          description: OK - Returns the complete details of the requested object type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeInformation'
              examples:
                Project Object Type:
                  summary: Example of project object type details
                  description: Project Object Type
                  value:
                    id: ef4e5bf9-7462-43af-b74f-72b61308629b
                    name: projects
                    nameKey: CE.Projects.Name
                    seeded: true
                    moduleName: CustomEntityManagement
                    schemaName: projects
                    description: A collaborative object set up to achieve one or more unique and specific business outcomes.
                    descriptionKey: CE.Projects.Description
                    workflowType: ef4e5bf9-7462-43af-b74f-72b61308629b
                    enabled: true
                    moduleScopes:
                    - AA
                    - AIG
                    - DM
                    settings:
                      enableWorkflow: true
                      enableWorkflowStageTracking: true
                      enableAudit: true
                      assessable: true
                      enableTask: true
                      enableRisk: true
                      enableDocument: true
                      enableControl: true
                      enableWebForm: false
                      enableComment: true
                    auditFields:
                      createdDate: '2023-02-03T14:59:44.487Z'
                      lastUpdatedDate: '2025-02-03T09:21:20.040Z'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
