      parameters:
      - name: page
        in: query
        description: The page number of the results.
        schema:
          description: Results page to be retrieved (0..N). Example- '?page=1
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          description: Number of records per page (1..50). Example- '?size=20
          type: integer
          format: int32
          default: 10
          maximum: 2000
          minimum: 1
        example: 50
      - name: sort
        in: query
        description: The sort criteria that dictates the order of the results.
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
        example: name,asc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeQueryCriteria'
            examples:
              Search System and Active Object Types:
                summary: Example of searching for system and active object types containing 'project' in name
                description: Search System and Active Object Types
                value:
                  fullText: Projects
                  filters:
                  - field: moduleScopes.module
                    value:
                    - AIG
                    operator: EQUAL_TO
                  - field: enabled
                    value:
                    - true
                    operator: EQUAL_TO
                  - field: seeded
                    value:
                    - true
                    operator: EQUAL_TO
              Search Custom and Active Object Types:
                summary: Example of searching for custom and active object types containing 'project' in name
                description: Search Custom and Active Object Types
                value:
                  fullText: GR1
                  filters:
                  - field: moduleScopes.module
                    value:
                    - DM
                    operator: EQUAL_TO
                  - field: enabled
                    value:
                    - true
                    operator: EQUAL_TO
                  - field: seeded
                    value:
                    - false
                    operator: EQUAL_TO
      responses:
        '200':
          description: OK - Returns a paginated list of object types matching the criteria
          content:
