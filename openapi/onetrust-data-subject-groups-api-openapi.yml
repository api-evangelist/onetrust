    delete:
      operationId: deleteUsingDELETE
      summary: Delete Data Subject Group
      description: Use this API to delete an existing Data Subject Group.
      tags:
      - Data Subject Groups
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-universal-consent-preference-management-oas.json
      parameters:
