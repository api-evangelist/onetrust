            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - ConsentPreferences-UniversalConsentPreferenceManag_OAUTH2:
        - CONSENT
        - CONSENT_READ
    put:
      operationId: updateLinkedIdentityGroupUsingPUT
      summary: Update Data Subject Group
      description: 'Use this API to update an existing Data Subject Group.


        > 🗒 Things to Know

        >

        > - Data Subject Groups must contain at least one primary data subject identifier and two data subjects.

        > - To update the Data Subject Group name, use the `groupName` parameter and enter a new name different from the one already in use.'
      tags:
      - Data Subject Groups
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-universal-consent-preference-management-oas.json
      parameters:
      - name: linkedIdentityGroupId
        in: path
        description: Unique identifier identifying a Data Subject Group.
        required: true
        schema:
          type: string
          format: uuid
          example: 3d8c79aa-5a14-48a4-b88d-f023913ec2ca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentPreferences-UniversalConsentPreferenceManag_LinkedIdentityGroupRequest_Detailed'
      responses:
        '200':
          description: OK - Successfully updated Data Subject Group.
          content:
            application/json:
              schema:
