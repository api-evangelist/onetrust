  /api/datasubject/v2/subtasks:
    get:
      operationId: subtasksUsingGET
      summary: Get List of Subtasks
      description: '> ❗️ End of Support Notification

        >

        > As of January 1, 2026, this API is now deprecated. Any customers leveraging this API are encouraged to use the Get List of Subtasks by Criteria API. For more information, see OneTrust API Sunsetting & Deprecation Guidelines.


        Use this API to retrieve a list of all subtasks. The response will include details for each subtask along with the request approver, created date, and deadline.


        > 🗒 Things to Know

        >

        > - This API does not return subtasks in **Complete** status.'
      tags:
      - Subtasks
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-subject-request-dsr-automation.json
      parameters:
      - name: language
        in: query
        required: false
        schema:
          description: "A language code that identifies the language in which the Request Type and Subject Type values should be returned, assuming translations are available for that language. \nExamples: language=en-us for English, language=de for German, language=es for Spanish, etc."
          type: string
        example: en-us
      - name: modifieddate
        in: query
        required: false
        schema:
          description: A date (yyyyMMdd). Include to retrieve a list of subtasks modified on or after the specified date. For example, if you want to retrieve subtasks modified on or after January 30, 2019, include the modifieddate=20190130 parameter in your query.
          type: string
          format: date
        example: 20190130
      - name: status
        in: query
        required: false
        schema:
          description: 'To get a SubTasks according to Status.

            Examples: status=assigned'
          type: string
        example: assigned
      - name: openrequests
        in: query
        required: false
        schema:
          description: 'An optional parameter to show subtasks on open requests if set to true.if this parameter is set to false or omitted, the response will contain subtasks on all requests Examples: openrequests=true'
          type: boolean
          default: false
        example: true
      - name: page
        in: query
        schema:
          description: Results page you want to retrieve. Page number starts with 0 (0..N)
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        schema:
          description: Number of records per page. Maximum page size allowed is 500
          type: integer
          format: int32
          default: 20
          maximum: 500
          minimum: 1
        example: 20
      - name: sort
        in: query
        schema:
          description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending.'
          type: string
          enum:
          - taskName,asc
          - taskName,desc
          - createdDate,asc
          - createdDate,desc
          - lastModifiedDate,asc
          - lastModifiedDate,desc
        example: createdDate,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivacyAutomation-DataSubjectRequestDSRAutomation_SubTaskListV2Dto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - PrivacyAutomation-DataSubjectRequestDSRAutomation_OAUTH2:
        - DSAR
        - DSAR_READ
        - DSAR_WRITE
