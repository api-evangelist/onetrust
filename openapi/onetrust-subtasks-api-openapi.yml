      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-subject-request-dsr-automation.json
      parameters:
      - name: includeClosedSubtasks
        in: query
        required: false
        schema:
          description: Include closed subtasks in the response
          type: boolean
          default: false
        example: true
      - name: onlyActivatedSubtasks
        in: query
        required: false
        schema:
          description: Only include activated subtasks in the response
          type: boolean
          default: false
        example: true
      - name: page
        in: query
        schema:
          description: Results page you want to retrieve. Page number starts with 0 (0..N)
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        schema:
