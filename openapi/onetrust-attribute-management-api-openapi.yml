        - AI_GOVERNANCE_WRITE
  /api/ai-governance/v1/schema-attributes:
    post:
      operationId: addAttributeUsingPOST
      summary: Add Attribute to Schema
      description: 'Use this API to add an attribute to a specific schema.


        > 🗒 Things to Know

        >

        > - This API only supports AI Governance entities (Models, Datasets, AI Systems, and AI Agents).

        > - AI Governance APIs will become available over the course of the Spring as customer tenants are upgraded to enhanced AI Governance services. No customer action is required and more detailed information will be published in upcoming release notes and product documentation.'
      tags:
      - Attribute Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/ai-governance.json
      parameters:
      - name: schemaName
        in: query
        description: Name of the schema where the attribute will be created
        required: true
        schema:
          type: string
        example: datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeCreateRequest'
            examples:
              Text Attribute Example:
                summary: Create a simple text attribute
                description: Creates a basic text attribute for the specified schema
                value:
                  name: Text Demo Attr
                  scoreLevelName: ''
                  description: Text Demo Attr
                  responseType: Text
                  required: false
                  encrypted: false
                  allowOther: false
                  options: []
                  optionType: none
                  referenceCategoryIds: []
                  formula: null
                  context:
                    parameters:
                      RecomputeFormulaEntities: false
                  responseSubType: null
                  maxMultiSelectAllowedOptionValues: null
                  metadata: ''
              Single Select Attribute Example:
                summary: Create a single select attribute with options
                description: Creates a single select attribute with predefined options
                value:
                  name: Country List Single Select Attribute
                  scoreLevelName: ''
                  description: Country List Single Select Attribute
                  responseType: SingleSelect
                  required: false
                  encrypted: false
                  allowOther: false
                  options:
                  - option: India
                    optionKey: OneTrustApp.OM.CustomEntity.Attributes.734b69e1-4b53-4f45-a1c2-034a72793d89
