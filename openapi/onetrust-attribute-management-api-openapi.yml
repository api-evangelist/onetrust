          description: Created
          content:
            application/json:
              schema:
                description: Created attribute details
                $ref: '#/components/schemas/AttributeInformation'
              examples:
                Text Attribute Response:
                  summary: Response for created text attribute
                  description: Details of the created text attribute
                  value:
                    id: 347f4ba0-d705-43c6-a138-16424efb5823
                    name: Text Demo Attr
                    nameKey: Attributes.l5ahlovqi5cstbwen6m3ca7cua
                    description: Text Demo Attr
                    descriptionKey: Attributes.dqiw2vt4uvhizhpjlxaolkknni
                    fieldName: attributeTextValue.value1_3
                    mappedFieldName: attributeTextValue.value1
