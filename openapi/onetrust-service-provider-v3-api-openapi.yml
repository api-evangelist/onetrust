          example: /api/scim/v3/Users/53b1325c-081f-4f05-b41b-ba8cbdb7bae9
          maxLength: 2083
          minLength: 1
        version:
          description: The version of the resource
          type: string
          example: W/"f0f2a936"
          maxLength: 100
          minLength: 1
        attributes:
          type: array
          items:
            description: The set of attributes
            example:
            - active
