          description: Indicates whether the service provider supports the operation
          type: boolean
          example: false
        maxOperations:
          type: integer
          format: int32
        maxPayloadSize:
          type: integer
          format: int32
  securitySchemes:
    OAUTH2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{hostname}/api/access/v1/oauth/token
          scopes:
            SCIM: Grants full access to the SCIM APIs for User Provisioning. This includes all the endpoints under Users, Groups, Resources, Schemas and Service Provider.
