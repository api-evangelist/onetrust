          type: boolean
          example: false
    AuthenticationScheme:
      type: object
      properties:
        name:
          description: Name of the authentication scheme
          type: string
          example: Oauth2 Bearer
        description:
          description: Description of the authentication scheme
          type: string
          example: OAuth2 Bearer access token is used for authorization.
        specUrl:
