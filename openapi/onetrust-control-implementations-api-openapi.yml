openapi: 3.2.0
info:
  title: Tech Risk & Compliance - IT Risk Management Control…
  description: The IT Risk Management API provides comprehensive REST endpoints for managing enterprise security controls, threats, vulnerabilities, and their implementations with OAuth2 security and extensive customization capabilities.
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Control Implementations
  description: APIs to handle control implementation operations including creation, updates, entity associations, attachment management, and comprehensive search across multiple entity types.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
  x-displayName: Control Implementations
paths:
  /api/controls/v1/control-implementation-attributes/search:
    post:
      operationId: findAllControlImplementationsAttributesAndOptionsByUsingPOST
      summary: Search Control Implementation Attributes
      description: Use this API to search for control implementation attributes by key terms and filters.
      tags:
      - Control Implementations
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_AttributeQueryCriteria'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_AttributeInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-ITRiskManagement_OAUTH2:
        - CONTROL
  /api/controls/v1/control-implementations/pages:
    post:
      operationId: findAllControlImplementationsUsingPOST
      summary: Get List of Control Implementations
      description: Use this API to retrieve a list of all control implementations. The response will include relevant details for each control implementation, including framework and category details and associated attributes.
      tags:
      - Control Implementations
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
      parameters:
      - name: page
        in: query
        description: Results page to be retrieved (0..N)
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Number of records per page
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 2000
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending'
        schema:
          type: string
          enum:
          - number,asc
          - number,desc
          - primaryEntityName,asc
          - primaryEntityName,desc
          - primaryEntityType,asc
          - primaryEntityType,desc
          - controlIdentifier,asc
          - controlIdentifier,desc
          - controlName,asc
          - controlName,desc
          - frameworkName,asc
          - frameworkName,desc
          - categoryName,asc
          - categoryName,desc
          - effectiveness,asc
          - effectiveness,desc
          - maturityName,asc
          - maturityName,desc
          - status,asc
          - status,desc
          - createdDate,asc
          - createdDate,desc
          - lastModifiedDate,asc
          - lastModifiedDate,desc
        example: number,asc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_SearchCriteriaInformation'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_PageControlImplementationDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-ITRiskManagement_OAUTH2:
        - CONTROL
  /api/controls/v1/control-implementations/{guid}:
    get:
      operationId: getControlImplementationDetailsUsingGET
      summary: Get Control Implementation
      description: Use this API to retrieve a single control implementation by its unique identifier along with the associated attributes, category, and framework details.
      tags:
      - Control Implementations
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
      parameters:
      - name: guid
        in: path
        description: ID of the control entity implementation.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_ControlImplementationDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-ITRiskManagement_OAUTH2:
        - CONTROL
    put:
      operationId: updateControlImplementationByImplementationIdUsingPUT
      summary: Update Control Implementation
      description: 'Use this API to update the attributes of a specific control implementation.


        > 🗒 Things to Know

        >

        > - The Update Control API can be used to update the attributes of a control in the Controls Library.'
      tags:
      - Control Implementations
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
      parameters:
      - name: guid
        in: path
        description: ID of the control entity implementation.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_ControlImplementationUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_ControlImplementationDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-ITRiskManagement_OAUTH2:
        - CONTROL
    delete:
      operationId: removeControlImplementationByEntityAndImplementationIdUsingDELETE
      summary: Delete Control Implementation
      description: Use this API to delete a control implementation from an entity.
      tags:
      - Control Implementations
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
      parameters:
      - name: entityId
        in: query
        description: ID of the entity. The value can be obtained using [Get List of Control Implementations by Entity](/onetrust/reference/findallcontrolimplementationsusingpost) API.
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        description: ID of the control implementation. The value can be obtained using [Get List of Control Implementations by Entity](/onetrust/reference/findallcontrolimplementationsusingpost) API.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-ITRiskManagement_OAUTH2:
        - CONTROL
  /api/controls/v1/control-implementations/{guid}/attachments:
    post:
      operationId: addAttachmentsToImplementationUsingPOST
      summary: Attach Files to Control Implementation
      description: 'Use this API to attach a list of files to a specific control implementation.


        > 🗒 Things to Know

        >

        > - The files must first be uploaded to the OneTrust application using the Upload File API. The `Id` and `Name` parameter values returned in the Upload File API response are required in the request body for this API.'
      tags:
      - Control Implementations
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
      parameters:
      - name: guid
        in: path
        description: ID of the control implementation. The value can be obtained using [Get List of Control Implementations by Entity](/onetrust/reference/findallcontrolimplementationsusingpost) API.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_ImplementationAttachmentCreateRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-ITRiskManagement_OAUTH2:
        - CONTROL
  /api/controls/v1/entities/{entityId}/control-implementations/pages:
    post:
      operationId: findAssociatedControlImplementationsUsingPOST
      summary: Get List of Control Implementations by Entity
      description: Use this API to retrieve a list of all control implementations by entity, such as by assets, processing activities, legal entities, risks, and vendors.
      tags:
      - Control Implementations
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
      parameters:
      - name: entityId
        in: path
        description: ID of the entity. This value can be obtained using [Get Control Implementation](/onetrust/reference/getcontrolimplementationdetailsusingget) API.
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Results page to be retrieved (0..N)
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Number of records per page
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 2000
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending'
        schema:
          type: string
          enum:
          - number,asc
          - number,desc
          - entityName,asc
          - entityName,desc
          - entityType,asc
          - entityType,desc
          - controlIdentifier,asc
          - controlIdentifier,desc
          - controlName,asc
          - controlName,desc
          - frameworkName,asc
          - frameworkName,desc
          - categoryName,asc
          - categoryName,desc
          - effectiveness,asc
          - effectiveness,desc
          - maturityName,asc
          - maturityName,desc
          - status,asc
          - status,desc
          - primaryEntityName,asc
          - primaryEntityName,desc
          - primaryEntityType,asc
          - primaryEntityType,desc
          - createdDate,asc
          - createdDate,desc
          - lastModifiedDate,asc
          - lastModifiedDate,desc
        example: number,asc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_SearchCriteriaInformation'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_PageControlImplementationEntityDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-ITRiskManagement_OAUTH2:
        - CONTROL
components:
  schemas:
    TechRiskCompliance-ITRiskManagement_AttributeOptionMetadataInformation:
      type: object
      properties:
        entityTypeName:
          description: Option Source Entity Type
          type: string
          example: Location
        basicServiceContextPath:
          description: Basic Url for the Option source Service
          type: string
          example: /api/location
        optionUrl:
          description: Api URL for the Drop Down Api
          type: string
          example: /api/ontology/ui/v1/entity-types/names/purpose/entities/basic-details/pages
        optionListUrl:
          description: Api URL for the Drop Down Api. Complete List of entities
          type: string
          example: /api/ontology/ui/v1/entity-types/names/purpose/entities/basic-details
        viewType:
          description: This will help to identify the view type of list
          type: string
        optionType:
          description: Option Type
          type: string
          example: BusinessLocations
        permissions:
          description: Permissions
          type: array
          items:
            type: string
          example: '[features.core-constructs.view]'
        applicationUrl:
          description: Application Url
          type: string
          example: /settings/location-management/location/Location
    TechRiskCompliance-ITRiskManagement_PageControlImplementationEntityDto:
      type: object
      properties:
        content:
          description: The list of items for the current page.
          items:
            $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_ControlImplementationEntityDto'
          type: array
        empty:
          description: The flag to check if the entity is empty or not.
          type: boolean
          example: false
        first:
          description: The flag to check if the entity is first entity or not.
          type: boolean
          example: true
        last:
          description: The flag to check if the entity is last entity or not.
          type: boolean
          example: false
        number:
          description: The number associated with the result.
          type: integer
          format: int32
          example: 0
        numberOfElements:
          description: Total number of elements in the result.
          type: integer
          format: int32
          example: 20
        pageable:
          $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_Pageable'
        sort:
          $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_Sort'
        totalPages:
          description: Total number of pages in the result list.
          type: integer
          format: int32
          example: 5
        totalElements:
          description: Total number of elements in the result.
          type: integer
          format: int64
          example: 50
        size:
          description: Size of the result list.
          type: integer
          format: int32
          example: 20
    TechRiskCompliance-ITRiskManagement_StageApproverBasicDetails:
      type: object
      properties:
        id:
          description: stage approver id.
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174003
        firstName:
          description: stage approver first name.
          type: string
          example: John
        lastName:
          description: stage approver last name.
          type: string
          example: Doe
        approvedTimeStamp:
          description: approved time.
          type: string
          format: date-time
          example: '2020-11-05T22:01:21.200+00:00'
        status:
          description: stage approved status.
          type: string
          example: approved
    TechRiskCompliance-ITRiskManagement_BasicDetail:
      type: object
      properties:
        id:
          description: Identifier (GUID)
          type: string
          format: uuid
          example: 1a2b3c4e-5f6g-7h8i-9j0k-1l2m3n4o5p6q
        name:
          description: Name
          type: string
          example: Entity Name
    TechRiskCompliance-ITRiskManagement_SearchCriteriaInformation:
      type: object
      properties:
        filters:
          description: Filters used in search.
          type: array
          items:
            $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_FilterInformation'
          uniqueItems: true
        fullText:
          description: Full text search terms.
          type: string
          example: firewall
        excludeTotalRecordsCount:
          type: boolean
    TechRiskCompliance-ITRiskManagement_CategoryInformation:
      type: object
      properties:
        id:
          description: Category unique identifier
          type: string
          format: uuid
        name:
          description: Category name
          type: string
          example: Financial Category
        nameKey:
          description: Category nameKey for localization support
          type: string
          example: IM.FinancialCategoryName
    TechRiskCompliance-ITRiskManagement_ImplementationAttachmentCreateRequest:
      type: object
      properties:
        controlAttachmentRequests:
          description: List of attachment requests to be associated with the control implementation.
          type: array
          items:
            $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_ImplementationAttachmentRequest'
      required:
      - controlAttachmentRequests
    TechRiskCompliance-ITRiskManagement_ControlEntityInformation:
      type: object
      properties:
        id:
          description: The identifier (GUID) of the related entity.
          type: string
          format: uuid
          example: 1ab2fff0-cb80-b560-99a1-4a3b527f61f5
        name:
          description: The name of the entity.
          type: string
          example: Asset 305
        type:
          description: The type of the related entity.
          type: string
          example: Risks
          enum:
          - Risks
          - Assets
          - ProcessingActivities
          - Vendors
          - Entities
        controlEntityType:
          description: The type of the related entity.
          example:
            id: Risks
          $ref: '#/components/schemas/TechRiskCompliance-ITRiskManagement_ControlEntityTypeInformation'
        organizationId:
          description: The identifier (GUID) of the organization which contains the entity.
          type: string
          format: uuid
          example: 1ab2fff0-cb80-b560-99a1-4a3b527f61f5
        softInherited:
          description: Indicates if this control is soft-inherited or not.
          type: boolean
          example: false
        relationshipLabel:
          description: The RelationshipType to the control entity.
          type: string
          example: IMPLEMENTED_ON
          enum:
          - IMPLEMENTED_ON
          - MITIGATES
          - LEVERAGED_BY
          - INCLUDED_IN
          - RELATED_TO
        isPrimary:
          description: Indicates if entity is primary.
          type: boolean
          example: true
      required:
      - controlEntityType
      - id
      - name
      - type
    TechRiskCompliance-ITRiskManagement_ImplementationEntityLinkDto:
      type: object
      properties:
        id:
          description: GUID of control implementation entity link.
          type: string
          format: uuid
          example: 1a2b3c4e-5f6g-7h8i-9j0k-1l2m3n4o5p6q
        sourceId:
          description: GUID of control implementation.
          type: string
          format: uuid
          example: 1a2b3c4e-5f6g-7h8i-9j0k-1l2m3n4o5p6q
        sourceName:
          description: Control implementation name.
          type: string
          example: Control name
        sourceType:
          description: Control implementation.
          type: string
          example: Control
        targetId:
          description: GUID of target entity.
          type: string
          format: uuid
          example: 1a2b3c4e-5f6g-7h8i-9j0k-1l2m3n4o5pe3
        targetName:
          description: Target entity name.
          type: string
          example: Asset124
        targetType:
          description: Target entity type.
          type: string
          example: Assets
        organizationId:
          description: GUID of organization.
          type: string
          format: uuid
          example: 1a2b3c4e-5f6g-7h8i-9j0k-1l2m3n4o5p6q
        label:
          description: Relationship label.
          type: string
          example: LEVERAGED_BY
          enum:
          - IMPLEMENTED_ON
          - MITIGATES
          - LEVERAGED_BY
          - INCLUDED_IN
          - RELATED_TO
        primary:
          type: boolean
    TechRiskCompliance-ITRiskManagement_AttributeOptionMetadata:
      type: object
      properties:
        hint:
          description: Hint
          type: string
        hintKey:
          description: Hint key which can be used for translation
          type: string
    TechRiskCompliance-ITRiskManagement_AbacBasicAssignmentInfo:
      type: object
      properties:
        assignmentId:
          description: GUID of the linked assignment
          type: string
          format: uuid
