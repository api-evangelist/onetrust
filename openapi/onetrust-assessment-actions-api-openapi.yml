                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - PrivacyAutomation-AssessmentAutomation_OAUTH2:
        - ASSESSMENT
  /api/assessment/v2/assessments/{assessmentId}/tasks:
    post:
      operationId: createTaskUsingPOST
      summary: Create Assessment Task
      description: 'Use this API to create new tasks on an assessment. Only a single task can be created on an assessment per API call.


        > 🗒 Things to Know

        >

        > - Tasks cannot be created for the following assessment types:

        >

        > - Global Readiness Assessment

        >

        > - Readiness Assessment

        >

        > - Program Benchmarking

        >

        > - Dynamic Incident Notification Assessment'
      tags:
      - Assessment Actions
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-assessment-automation.json
      parameters:
      - name: assessmentId
        in: path
        description: The unique ID of the assessment in which to create the task.
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyAutomation-AssessmentAutomation_TaskCreateRequest'
      responses:
        '201':
