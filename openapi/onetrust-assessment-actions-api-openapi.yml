                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - PrivacyAutomation-AssessmentAutomation_OAUTH2:
        - ASSESSMENT
  /api/assessment/v2/assessments/{id}/reopen:
    post:
      operationId: reopenAssessmentUsingPOST
      summary: Reopen Assessment
      description: Use this API to reopen a specific assessment to request more information from respondents. This action will move the assessment from the Completed stage to the Under Review stage and comments will be provided to the respondent in an email notification.
