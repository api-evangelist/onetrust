  /api/datasubject/v2/requestqueues/{requestQueueRefId}/customfields/{language}:
    put:
      operationId: updateCustomFieldsUsingPUT
      summary: Update Request Custom Fields
      description: Use this API to update the fields of a request.
      tags:
      - Request Queues
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-subject-request-dsr-automation.json
