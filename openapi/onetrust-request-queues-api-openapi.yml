      security:
      - PrivacyAutomation-DataSubjectRequestDSRAutomation_OAUTH2:
        - DSAR
        - DSAR_READ
        - DSAR_WRITE
  /api/datasubject/v2/requestqueues/{language}:
    get:
      operationId: getAllRequestQueuesV2UsingGET
      summary: Get List of Requests
      description: Use this API to retrieve a list of all requests. The response will include details for each request along with the approver, date created, and data subject's first and last name.
      tags:
      - Request Queues
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-subject-request-dsr-automation.json
      parameters:
      - name: language
        in: path
        required: true
        schema:
          description: "A language code that identifies the language in which the request data should be returned, assuming translations are available for that language. \nExamples: en-us for English, de for German, fr for French, etc."
          type: string
        example: en-us
      - name: modifieddate
        in: query
        required: false
        schema:
          description: A date (yyyyMMdd). Include to retrieve a list of requests modified on or after the specified date. For example, if you want to retrieve requests modified on or after January 30, 2019, include the modifieddate=20190130 parameter in your query.
          type: string
          format: date
        example: 20190130
      - name: createddate
        in: query
        required: false
        schema:
          description: A date (yyyyMMdd). Include to retrieve a list of requests created on or after the specified date. For example, if you want to retrieve requests created on or after January 30, 2019, include the createddate=20190130 parameter in your query.
          type: string
          format: date
        example: 20190130
      - name: status
        in: query
        required: false
        schema:
          description: Filter requests by stage name. Parameters must be URL encoded.
          type: string
        example: NEW
      - name: ignoreUserRequests
        in: query
        required: false
        schema:
          description: A flag to exclude requests associated with user if they are not associated with specified organization.
          type: boolean
          default: false
      - name: page
        in: query
        schema:
          description: Results page you want to retrieve. Page number starts with 0 (0..N)
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        schema:
          description: Number of records per page. Maximum page size allowed is 500
          type: integer
          format: int32
          default: 20
          maximum: 500
          minimum: 1
        example: 20
      - name: sort
        in: query
        schema:
          description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending.'
          type: string
        example: createdDate,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivacyAutomation-DataSubjectRequestDSRAutomation_RequestQueueV2Dto'
        '400':
