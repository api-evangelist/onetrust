      type: object
      properties:
        RequestIDs:
          description: An array of 10-character Unique IDs of the Request(s) to be deleted.
          type: array
          items:
            type: string
          example:
          - 8KDL2A4JAM
          - S62QF8K5PJ
          maxItems: 2000
          minItems: 0
        CreatedDateRange:
          description: A date range for outlining start date and end date. All requests with a Created Date within this range will be deleted.
          $ref: '#/components/schemas/PrivacyAutomation-DataSubjectRequestDSRAutomation_DateRangeDto'
        EndDateRange:
          description: A date range for outlining start date and end date. All requests with an End Date within this range will be deleted.
          $ref: '#/components/schemas/PrivacyAutomation-DataSubjectRequestDSRAutomation_DateRangeDto'
        ModifiedDateRange:
          description: A date range for outlining start date and end date. All requests with a Modified Date within this range will be deleted.
          $ref: '#/components/schemas/PrivacyAutomation-DataSubjectRequestDSRAutomation_DateRangeDto'
        Status:
          description: Filter requests by the Stage name. Only requests in this stage will be deleted.
          type: string
          example: EXPIRED
        Organization:
          description: Filter requests by Organization. Only requests in this organization will be deleted.
          type: string
          example: BRAND A
        Country:
          description: Filter requests by Country code. Only requests with this Country selected will be deleted.
          type: string
          example: US
        WorkflowID:
          description: Filter requests by Workflow ID. Only requests using this workflow will be deleted.
          type: string
          example: 4f068b73-4edc-4920-a00c-9f39cd01c5f6
        WebformID:
          description: Filter requests by Web Form ID. Only requests using this web form will be deleted.
          type: string
          example: 0388dd81-0c41-4181-a47c-1e2777727b73
        RequestType:
          description: Filter requests by Request Type. Only requests with the Request Type will be deleted.
          type: string
          example: Opt Out
