  /api/assessment/v3/assessments/list:
    post:
      operationId: getAssessmentsUsingPOST
      summary: Get List of Assessments by Criteria
      description: 'Use this API to retrieve list of all the assessments or assessments by filter criteria like Approver Ids, Respondent Ids, Template Ids etc. The response will include details such as the assessment ID, number, stage, result, primary record, and associated organization.


        > 🗒 Things to Know

        >

        > - All assessments regardless of their stage are returned in the response by default.

        >

        > - The assessments can be filtered by stage using the `assessmentStatuses, templateTypes, assessmentArchivalState` query parameter. Other than these commonly used filters, request body can be used to filter assessments by approver Ids, respondent Ids, template Ids, workflow stage name.'
      tags:
      - Assessments
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-assessment-automation.json
      parameters:
      - name: templateTypes
        in: query
        description: 'List of template types to filter assessments by. Available options:


          - **PIA** (PIA & DPIA Automation)

          - **VENDOR** (Third-Party Risk Management)

          - **ITRM** (IT & Security Risk Management)

          - **CONTROL** (Risk and Controls)

          - **INCIDENT** (Incident Management)

          - **EXCHANGE** (Third-Party Risk Exchange)

          - **ESG** (ESG Program Reporting)

          - **DISCLOSURE** (Disclosure Management)

          - **DISCLOSURE_YOY** (Year Over Year Disclosures)

          - **ERM** (Enterprise Risk Management)

          - **TPDD** (Third-Party Due Diligence)

          - **AIGOVERNANCE** (AI Governance)'
        required: false
        schema:
          type: array
          items:
            type: string
            description: Template types used in assessments
            enum:
            - PIA
            - VENDOR
            - ITRM
            - CONTROL
            - INCIDENT
            - EXCHANGE
            - ESG
            - DISCLOSURE
            - DISCLOSURE_YOY
            - ERM
            - TPDD
            - AIGOVERNANCE
        example:
        - PIA
        - VENDOR
        - ITRM
      - name: assessmentStatuses
        in: query
        description: List of assessment statuses to filter assessments by
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NOT_STARTED
            - IN_PROGRESS
            - UNDER_REVIEW
            - COMPLETED
        example:
        - IN_PROGRESS
        - UNDER_REVIEW
      - name: assessmentArchivalState
        in: query
        description: Filter assessments by their archival state. Use ALL to include both archived and non-archived assessments, ARCHIVED to include only archived assessments, or NON_ARCHIVED to include only non-archived assessments.
        required: false
        schema:
          type: string
          example: NON_ARCHIVED
          default: NON_ARCHIVED
          enum:
          - ALL
          - ARCHIVED
          - NON_ARCHIVED
      - name: page
        in: query
        description: Results page to be retrieved (0..N). Example- '?page=1
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: Number of records per page (1…N).
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 2000
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        schema:
          type: string
          default: createdDate,desc
          enum:
          - number,asc
          - number,desc
          - status,asc
          - status,desc
          - createdDate,asc
          - createdDate,desc
          - name,asc
          - name,desc
          - result,asc
          - result,desc
          - orgGroupName,asc
          - orgGroupName,desc
          - deadline,asc
          - deadline,desc
          - openRiskCount,asc
          - openRiskCount,desc
          - openInfoRequestCount,asc
          - openInfoRequestCount,desc
        example: createdDate,desc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyAutomation-AssessmentAutomation_AssessmentListRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyAutomation-AssessmentAutomation_AssessmentListResponseListAssessmentListViewResponseV2'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - PrivacyAutomation-AssessmentAutomation_OAUTH2:
        - ASSESSMENT_READ
        - ASSESSMENT
