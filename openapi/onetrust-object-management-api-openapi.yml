components:
  schemas:
    EntityBasicUserInformation:
      type: object
      properties:
        id:
          description: The unique identifier of the user who last modified the record.
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        name:
          description: The name of the user who last modified the record.
          type: string
          example: First Last
        email:
          description: The email address of the user who last modified the record.
          type: string
          example: user@gmail.com
        initials:
          description: The initials of the user who last modified the record.
          type: string
          example: FL
    EntityDetailRequest:
      type: object
      properties:
        extendedBaseAttributes:
          description: The details of the attribute.
          type: object
          example:
            textAttributeName:
            - value: Text
            optionBasedAttributeName:
            - id: f2229953-b4b5-4042-8cb9-b78038cc4c46
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AttributeValueInformation'
    AttributePredicate:
      type: object
      properties:
        field:
          description: The field by which to filter results.
          type: string
        operator:
          description: The relationship that must be met between the field and the value.
          type: string
          enum:
          - EQUAL_TO
          - NOT_EQUAL_TO
          - GREATER_THAN
          - GREATER_THAN_EQUAL_TO
          - LESS_THAN
          - LESS_THAN_EQUAL_TO
          - BETWEEN
        value:
          description: The value by which to filter results.
          type: object
          oneOf:
          - type: string
            format: uuid
          - type: string
            format: date
          - type: string
            format: date-time
          - type: string
          - type: number
        toValue:
          description: The end value by which to filter results.
          type: object
          oneOf:
          - type: string
            format: date
          - type: string
            format: date-time
          - type: string
          - type: number
      required:
      - field
    Sort:
      type: object
      properties:
        sorted:
          description: This flag indicates whether the results were sorted.
          type: boolean
          example: true
        unsorted:
          description: This flag indicates whether the results were unsorted.
          type: boolean
          example: false
        empty:
          description: This flag indicates whether sort criteria was left undefined.
          type: boolean
          example: false
    Page:
      type: object
      properties:
        totalElements:
          description: The total number of results in the list.
          type: integer
          format: int64
        totalPages:
          description: The total number of pages in the list.
          type: integer
          format: int32
        size:
          description: The number of results per page.
          type: integer
          format: int32
        content:
          description: The data of the returned objects.
          items:
            type: object
          type: array
        number:
          description: The page number of the results.
          type: integer
          format: int32
        sort:
          description: The sort criteria that dictates the order of the results.
          $ref: '#/components/schemas/SortObject'
        first:
          description: This flag indicates whether the current page is the first page of the list.
          type: boolean
        last:
          description: This flag indicates whether the current page is the last page of the list.
          type: boolean
        numberOfElements:
          description: The number of results on the current page.
          type: integer
          format: int32
        pageable:
          description: The configuration parameters of the page.
          $ref: '#/components/schemas/PageableObject'
        empty:
          description: The flag indicates whether no results exist on the page.
          type: boolean
    EntityListRequest:
      type: object
      properties:
        context:
          description: The contextual details of the object.
          $ref: '#/components/schemas/ContextInformation'
        queryRequest:
          description: The details of the filter, text, and organization search criteria.
          $ref: '#/components/schemas/EntityQueryRequest'
        requestedFields:
          description: The details of the non-required fields to include in the response.
          $ref: '#/components/schemas/EntityFieldRequest'
      example:
        queryRequest:
          criteria:
            filters:
            - fieldName: name
              operator: contains
              value: OneTrust
            - fieldName: entityStatus
              operator: equals
              value: Active
            searchQuery: gdpr
            sort:
            - fieldName: lastModifiedTimestamp
              direction: DESC
          organizationTraversalStrategy: ancestors_and_descendants
          requestedOrganizationId: f2229953-b4b5-4042-8cb9-b78038cc4c46
          queryAction: ListEntity
        requestedFields:
          includeStandardFields: true
          includeCustomFields: true
          includeAuditFields: false
          specificStandardFields:
          - name
          - entityNumber
          - createdBy
          specificCustomFields:
          - vendor_tier
          - risk_score
    AttributeQueryCriteria:
      type: object
      properties:
        filters:
          description: The criteria used to filter results.
          type: array
          items:
            $ref: '#/components/schemas/AttributePredicate'
          uniqueItems: true
        fullText:
          description: The key terms for the search criteria.
          type: string
    EntityUpdateRequest:
      type: object
      properties:
        name:
          description: The name of the object.
          type: string
          example: OneTrust
          maxLength: 255
          minLength: 1
        organization:
          description: The details of the organization responsible for the object.
          example:
            id: f2229953-b4b5-4042-8cb9-b78038cc4c46
            name: Business Unit
          $ref: '#/components/schemas/EntityOrganizationInformation'
        attributes:
          description: This parameter can be used to store attribute details in key value pairs.
          type: object
          example:
            textAttributeName:
            - value: Text
            optionBasedAttributeName:
            - id: f2229953-b4b5-4042-8cb9-b78038cc4c46
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AttributeValueInformation'
      example:
        name: OneTrust Updated
        attributes:
          textAttributeName:
          - value: New Text Value
      title: Entity Update Request
    EntityRecordAuditInformation:
      type: object
      properties:
        createdDate:
          description: The date and time that the record was created.
          type: string
          format: date-time
          example: '2021-05-13T13:06:49.853Z'
        lastUpdatedDate:
          description: The date and time that the record was last updated.
          type: string
          format: date-time
          example: '2021-05-13T13:06:49.853Z'
        createdBy:
          description: The creation details of the record.
          example:
            id: c21319953-b4b5-4042-8cb9-b78038cc4c51
            name: Name
          $ref: '#/components/schemas/EntityBasicUserInformation'
        lastModifiedBy:
          description: The last modified details of the record.
          example:
            id: c21319953-b4b5-4042-8cb9-b78038cc4c51
            name: Name
          $ref: '#/components/schemas/EntityBasicUserInformation'
      required:
      - createdDate
    EntityQueryRequest:
      type: object
      properties:
        criteria:
          description: The details of the filter criteria.
          example:
            filters:
            - fieldName: name
              operator: contains
              value: OneTrust
            searchQuery: privacy
            sort:
            - fieldName: lastModifiedTimestamp
              direction: DESC
          $ref: '#/components/schemas/AttributeQueryCriteria'
        organizationTraversalStrategy:
          description: The strategy used to return objects within the organizational hierarchy.
          type: string
          example: ancestors_and_descendants
          enum:
          - ancestors_and_descendants
          - descendants
          - all
        requestedOrganizationId:
          description: The unique identifier of the organization for the request.
          type: string
          format: uuid
          example: f2229953-b4b5-4042-8cb9-b78038cc4c46
        queryAction:
          description: The action specifying the source of the API request.
          type: string
          example: ListEntity
      example:
        criteria:
          filters:
          - fieldName: name
            operator: contains
            value: OneTrust
