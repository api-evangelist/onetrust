openapi: 3.2.0
info:
  title: Platform - Object Manager Object Management API
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: The Object Manager APIs are used to integrate external systems and streamline the flow of data for objects created via Object Manager in the OneTrust Platform.
servers:
- url: https://{hostname}/api/custom-entity
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Object Management
  description: The Object Management APIs are used to manage objects created via Object Manager, including Projects, Models, and Datasets.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
paths:
  /v1/entities:
    post:
      operationId: addEntityUsingEntityTypeIdOrEntityTypeNameUsingPOST
      summary: Create Object
      description: 'Use this API to create a new object record.


        > 🗒 Things to Know

        >

        > - This API only supports creating Projects, Models, and Datasets objects via Object Manager.'
      tags:
      - Object Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: entityTypeIdentifier
        in: query
        description: The unique identifier of the object type.
        required: false
        schema:
          description: Identifier of the object type
          type: string
          format: uuid
        example: 2aa71ead-0c9a-416a-8471-bdfb67c8d113
      - name: entityTypeName
        in: query
        description: The name of the object type.
        required: false
        schema:
          description: Name of the object type
          type: string
        example: projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreateRequest'
            examples:
              Create Project Example:
                summary: Create a basic project object
                description: Example request to create a new project with basic fields and one attribute
                value:
                  name: test
                  attributes:
                    description:
                    - value: desc
                    status:
                    - id: 23d1e72f-d3ce-43a2-bb72-89cc2edaa6fa
                    projectOwner:
                    - id: 41955b71-e581-4187-ab6c-d00d1403350c
