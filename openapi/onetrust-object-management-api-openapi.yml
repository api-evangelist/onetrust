  /v1/entities/search:
    post:
      operationId: findAllByTypeIdAndCriteriaUsingPOST
      summary: Get Full Object Details
      description: 'Use this API to retrieve all the details for the specified object record by key terms and filters.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: page
        in: query
        description: The page number of the results.
        schema:
          description: Results page to be retrieved (0..N). Example- '?page=1
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          description: Number of records per page (1..50). Example- '?size=20
          type: integer
          format: int32
          default: 10
          maximum: 2000
          minimum: 1
        example: 50
      - name: sort
        in: query
        description: The sort criteria that dictates the order of the results.
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
        example: name,asc
      - name: entityTypeId
        in: query
        description: The unique identifier of the object type.
        required: false
        schema:
          description: Identifier of the object type
          type: string
          format: uuid
        example: 2aa71ead-0c9a-416a-8471-bdfb67c8d113
      - name: entityTypeName
        in: query
        description: The name of the object type.
        required: false
        schema:
          description: Name of the object type
          type: string
        example: vendors
      requestBody:
        content:
          application/json:
            schema:
              description: Search parameters including filtering criteria, pagination settings, and sort order
              $ref: '#/components/schemas/EntityListRequest'
            examples:
              Complex Search Example:
                summary: Search with multiple conditions
                description: Example request with multiple search conditions and pagination settings
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: description
                        value: desc
                        operator: EQUAL_TO
                      - field: projectOwner
                        value:
                        - 41955b71-e581-4187-ab6c-d00d1403350c
                        operator: EQUAL_TO
                      - field: attributeTextValue.value2
                        value: '2025-06-10T18:30:00.000Z'
                        toValue: '2025-06-12T18:30:00.000Z'
                        operator: BETWEEN
      responses:
