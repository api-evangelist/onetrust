openapi: 3.2.0
info:
  title: Platform - Object Manager Project Management API
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: The Object Manager APIs are used to integrate external systems and streamline the flow of data for objects created via Object Manager in the OneTrust Platform.
servers:
- url: https://{hostname}/api/custom-entity
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Project Management
  description: The Project Management APIs are used to conduct full management of Project objects.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
paths:
  /api/custom-entity/v1/projects:
    post:
      operationId: createProjectUsingPOST
      summary: Create Project Object
      description: 'Use this API to create a new Project object record.


        > 🗒 Things to Know

        >

        > - This API only supports creating Project objects via Object Manager.'
      tags:
      - Project Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            examples:
              Create a basic project:
                summary: Simple project creation request with minimal details
                description: Create a basic project
                value: "{\n \"name\": \"Data Analytics Platform Development\",\n \"description\": \"Development of an enterprise-wide data analytics platform\",\n \"deadline\": \"2025-12-31\",\n \"externalId\": \"PROJ-2025-001\",\n \"status\": \"Active\",\n \"type\": \"Development\"\n \"additionalAttributes\": {\n \"attributeMultiSelectValue.valueId1\": [\n {\n \"id\": \"17a0d9f9-234f-44a4-b467-ab9542551a3c\"\n },\n {\n \"id\": \"766e4e53-5aeb-4ce1-a81d-7a1bcf376092\"\n }\n ],\n \"attributeSingleSelectValue.value1\": [\n {\n \"id\": \"2a27dde9-50d9-47a5-839b-4e10a43c5333\"\n }\n ]\n },}"
              Create a comprehensive project:
                summary: Detailed project creation with all available fields
                description: Create a comprehensive project
                value:
                  name: Enterprise Data Warehouse Migration
                  description: Migration of legacy data warehouse to cloud-based solution
                  deadline: '2025-09-30'
                  externalId: PROJ-2025-002
                  projectLink: https://project-tracker.example.com/projects/PROJ-2025-002
                  intendedUse: Improve data analytics capabilities and reduce operational costs
                  businessValue: High
                  projectOwner: jane.doe@example.com
                  status: In Progress
                  type: Infrastructure
                  internalOrExternal: Internal
                  promotionStatus: Not Promoted
                  additionalAttributes:
                    priority:
                    - stringValue: High
                    completionPercentage:
                    - doubleValue: 15
                    stakeholders:
                    - stringValue: Executive Team, IT Department
                  entityDetail:
                    data:
                      owner: jane.doe@example.com
                      department: IT
                      budget: $1,500,000
                  organization:
                    id: f8e7d6c5-b4a3-2019-8765-432109876543
      responses:
        '201':
          description: Project entity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityInformation'
              examples:
                Created Project Response:
                  summary: Example of a successfully created project
                  description: Response containing the details of the newly created project entity
                  value:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    name: Data Analytics Platform Development
                    description: Development of an enterprise-wide data analytics platform
                    entityTypeId: dbc72382-65ec-4c1c-b6a9-83f7856a1f52
                    attributes:
                      deadline: '2025-12-31'
                      externalId: PROJ-2025-001
                      status: Active
                      type: Development
                    createdBy: user@example.com
                    createdDate: '2025-05-30T10:15:30Z'
                    lastModifiedBy: user@example.com
                    lastModifiedDate: '2025-05-30T10:15:30Z'
                    entityDetail:
                      owner: jane.doe@example.com
                      department: IT
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - object-manager
        - object-manager-write
        - integration
  /api/custom-entity/v1/projects/basic-details/search:
    post:
      operationId: findProjectBasicDetailsByQueryCriteriaUsingPOST
      summary: Get Basic Project Object Details
      description: 'Use this API to retrieve basic details for the specified Project object record by key terms and filters.


        > 🗒 Things to Know

        >

        > - This API only supports Project objects created via Object Manager.'
      tags:
      - Project Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: page
        in: query
        description: The page number of the results.
        schema:
          description: Results page to be retrieved (0..N). Example- '?page=1
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          description: Number of records per page (1..50). Example- '?size=20
          type: integer
          format: int32
          default: 10
          maximum: 2000
          minimum: 1
        example: 50
      - name: sort
        in: query
        description: The sort criteria that dictates the order of the results.
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
        example: name,asc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityQueryRequest'
            examples:
              Query by name pattern:
                summary: Query projects with names starting with 'Analytics'
                description: Query by name pattern
                value:
                  query: name:Analytics*
              Query by status:
                summary: Query projects with specific status
                description: Query by status
                value:
                  query: status:Active
              Query by priority and deadline range:
                summary: Find high priority projects with approaching deadlines
                description: Query by priority and deadline range
                value:
                  query: priority:High AND deadline:[NOW TO 2025-06-30T00:00:00Z]
              Query by completion percentage range:
                summary: Find projects with completion percentage in a specific range
                description: Query by completion percentage range
                value:
                  query: completionPercentage:[50 TO 75]
              Query by team assignments:
                summary: Find projects assigned to specific teams
                description: Query by team assignments
                value:
                  query: assignedTeam:("Data Science Team" OR "Analytics Team")
              Query by specific stakeholders:
                summary: Find projects with specific stakeholder mentions
                description: Query by specific stakeholders
                value:
                  query: stakeholders:*executive* OR stakeholders:*VP*
              Complex query with boolean logic:
                summary: Advanced query combining multiple conditions
                description: Complex query with boolean logic
                value:
                  query: (status:Active OR status:"In Progress") AND priority:(High OR Critical) AND completionPercentage:<75 AND deadline:<2025-06-30T00:00:00Z AND NOT name:*Legacy*
      responses:
        '200':
          description: Successfully retrieved list of basic project details matching query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEntityIdentifierInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - object-manager
        - object-manager-read
        - object-manager-write
  /api/custom-entity/v1/projects/search:
    post:
      operationId: findProjectsByListCriteriaUsingPOST
      summary: Get Project Object Details
      description: 'Use this API to retrieve all the details for the Project object record by key terms and filters.


        > 🗒 Things to Know

        >

        > - This API only supports Project objects created via Object Manager.'
      tags:
      - Project Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: page
        in: query
        description: The page number of the results.
        schema:
          description: Results page to be retrieved (0..N). Example- '?page=1
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of results per page.
        schema:
          description: Number of records per page (1..50). Example- '?size=20
          type: integer
          format: int32
          default: 10
          maximum: 2000
          minimum: 1
        example: 50
      - name: sort
        in: query
        description: The sort criteria that dictates the order of the results.
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
        example: name,asc
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityListRequest'
            examples:
              Filter by name:
                summary: Filter projects by name
                description: Filter by name
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: name
                        value: Project_0610
                        operator: EQUAL_TO
              Filter by project status:
                summary: Filter projects by specific status
                description: Filter by project status
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: status
                        value:
                        - 23d1e72f-d3ce-43a2-bb72-89cc2edaa6fa
                        operator: EQUAL_TO
              Filter by deadline and organization:
                summary: Filter projects by deadline and organization
                description: Filter by deadline and organization
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: deadline
                        value: '2025-06-08T18:30:00.000Z'
                        toValue: '2025-06-29T18:30:00.000Z'
                        operator: BETWEEN
                      - field: organization
                        value: c9e5a35b-9be7-4dd6-adac-0bee7c02384f
                        operator: EQUAL_TO
              Filter by multiple criteria:
                summary: Filter projects by status not equal to and creation date
                description: Filter by multiple criteria
                value: "{{\n \"queryRequest\": {\n \"criteria\": {\n \"fullText\": \"\",\n \"filters\": [\n {\n \"field\": \"status\",\n \"value\": [\n \"23d1e72f-d3ce-43a2-bb72-89cc2edaa6fa\"\n ],\n \"operator\": \"NOT_EQUAL_TO\"\n },\n {\n \"field\": \"createdDate\",\n \"value\": \"2025-06-08T18:30:00.000Z\",\n \"operator\": \"GREATER_THAN\"\n }\n ]\n }\n }\n}"
              Filter by custom attributes:
                summary: Filter projects by custom attributes
                description: Filter by custom attributes
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: attributeMultiSelectValue.valueId1
                        value:
                        - 9bbeb65a-e1d2-4236-b64d-cbf8de0a852f
                        operator: EQUAL_TO
                      - field: attributeTextValue.value1
                        value: text
                        operator: EQUAL_TO
              Complex filters with multiple criteria:
                summary: Advanced filtering with multiple criteria
                description: Complex filters with multiple criteria
                value:
                  queryRequest:
                    criteria:
                      fullText: ''
                      filters:
                      - field: attributeSingleSelectValue.value4_9
                        value:
                        - afcce13b-617a-4197-9cc1-ebddc51c117f
                        operator: EQUAL_TO
                      - field: attributeMultiSelectValue.valueId15_23
                        value:
                        - bfce6d48-f7e9-4aee-afe6-bf5aa6969c27
                        operator: EQUAL_TO
      responses:
        '200':
          description: Successfully retrieved list of projects matching criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEntityInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - object-manager
        - object-manager-read
        - object-manager-write
