components:
  schemas:
    TaskTypeInformation:
      type: object
      properties:
        name:
          description: The name of the task type.
          type: string
          example: DOCUMENT_REVIEW
          maxLength: 100
          minLength: 1
        nameKey:
          description: The name key of the task type used for translation purposes.
          type: string
          example: TaskRegistry.TaskType.DocumentReview
          maxLength: 255
          minLength: 1
        module:
          description: The source product of the task type.
          type: string
          example: ASSESSMENT
          maxLength: 100
          minLength: 1
        moduleNameTranslationKey:
          description: The name key of the product used for translation purposes.
          type: string
          example: TaskRegistry.Module.Assessment
          maxLength: 255
          minLength: 1
        id:
          description: The unique identifier of the task type.
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        label:
          description: The display label of the task type.
          type: string
          example: Document Review
          maxLength: 255
          minLength: 1
        icon:
          description: The icon of the task type.
          type: string
          example: document-check
          maxLength: 50
          minLength: 1
      example:
        id: 123e4567-e89b-12d3-a456-426614174000
        name: DOCUMENT_REVIEW
        nameKey: TaskRegistry.TaskType.DocumentReview
        module: ASSESSMENT
        moduleNameTranslationKey: TaskRegistry.Module.Assessment
        label: Document Review
        icon: document-check
      required:
      - id
      - label
      - module
      - moduleNameTranslationKey
      - name
      - nameKey
    UserInfo:
      type: object
      properties:
        name:
          description: The name of the user or user group.
          type: string
          example: John Doe
        nameWithAttributes:
          description: The name of the user or user group with additional attributes.
          type: string
          example: 'John Doe (Admin, Department: IT)'
      example:
        name: John Doe
        nameWithAttributes: 'John Doe (Admin, Department: IT)'
      required:
      - name
    TaskInformation:
      type: object
      properties:
        id:
          description: The unique identifier of the task.
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        parentEntityId:
          description: The unique identifier of the parent record where the task was created.
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        taskName:
          description: The name of the task.
          type: string
          example: Review Document XYZ
          maxLength: 255
          minLength: 1
        taskType:
          description: The details of the task type.
          example:
            id: 123e4567-e89b-12d3-a456-426614174000
            name: Document Review
            description: Review and approve documents
          $ref: '#/components/schemas/TaskTypeInformation'
        deadline:
          description: The date and time by which the task should be completed.
          type: string
          format: date-time
          example: '2023-12-31T23:59:59Z'
        status:
          description: The status of the task.
          type: string
          example: Open
          enum:
          - Open
          - Closed
        priority:
          description: The priority level of the task.
          type: string
          example: MEDIUM
          enum:
          - LOW
          - MEDIUM
          - HIGH
        description:
          description: The description of the task.
          type: string
          example: This task requires reviewing document X and providing feedback
          maxLength: 4000
        orgGroupId:
          description: The unique identifier of the organization responsible for the task.
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          deprecated: true
        orgGroupAttribute:
          description: The attribute details of the organization responsible for the task.
          example:
            value: OneTrust LLC
            valueKey: 123e4567-e89b-12d3-a456-426614174000
          $ref: '#/components/schemas/AttributeValue'
        assigneeId:
          description: The unique identifier of the user assigned as an assignee on the task.
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        isActive:
          description: This flag indicates whether the task is active.
          type: boolean
          example: true
          default: 'true'
        sourceType:
          description: The type of source that created the task.
          type: string
          example: RULES
          maxLength: 50
        sourceId:
          description: The unique identifier of the source that created the task.
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        moduleSource:
          description: The source product of the task.
          type: string
          example: assessment
          enum:
          - assessment
          - audit-mgmt
          - cyber-risk
          - data-mapping
          - data-governance
          - esg
          - erm
          - incident
          - issue
          - itrm
          - program-benchmarking
          - maturity-planning
          - risk
          - vendor
          - vendor-portal
          - compliance-automation
          - SpeakUp
          - EntityScoping
          - ControlObjective
          - exception
        taskAssignmentInformations:
          description: The details of the task assignment.
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignmentInformation'
          example:
          - assigneeId: 123e4567-e89b-12d3-a456-426614174000
            assigneeName: John Doe
            assignmentType: PRIMARY
        presentationMode:
          description: The presentation mode of the task.
          type: string
          example: DEFAULT
          enum:
          - NAVIGATION
          - DRAWER
        isCollaboratorSupported:
          description: This flag indicates whether users can be assigned as collaborators on the task.
          type: boolean
          example: true
          default: 'false'
        isCollaboratorGroupSupported:
          description: This flag indicates whether user groups can be assigned as collaborators on the task.
          type: boolean
          example: true
          default: 'false'
        relativeUrl:
          description: The relative URL associated with the task.
          type: string
          example: /tasks/review/123
          maxLength: 255
        activity:
          description: The type of activity for the task.
          type: string
          example: COMPLETE_TASK
          enum:
          - COMPLETE_TASK
          - REVIEW_DSARSUBTASK
          - APPROVE_RISK
          - RESPOND_TO_ASSESSMENT
          - COMPLETE_AUDIT
          - REVIEW_REQUEST
