  /v1/tasks/{taskId}:
    get:
      operationId: findTaskUsingGET_1
      summary: Get Task
      description: 'Use this API to retrieve a specific task on an object. The response will include details such as the activity history, assignee, and deadline.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Task Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: taskId
        in: path
        description: The unique identifier of the task.
        required: true
        schema:
          description: Unique identifier of the task to retrieve
          type: string
          format: uuid
          example: 41955b71-e581-4187-ab6c-d00d1403350c
        example: 41955b71-e581-4187-ab6c-d00d1403350c
      - name: includePermissionsMetadata
        in: query
        description: This flag indicates whether to include permissions metadata.
        required: false
        schema:
          description: Whether to include permissions metadata in the response
          type: boolean
          default: false
        example: false
      - name: excludeInactiveTask
        in: query
        description: This flag indicates whether to exclude inactive tasks.
        required: false
        schema:
          description: Whether to exclude inactive tasks from the response
          type: boolean
          default: false
        example: false
      responses:
        '200':
          description: OK
          content:
