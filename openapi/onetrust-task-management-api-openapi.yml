      - Task Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/ai-governance.json
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
            examples:
              Basic Task Creation:
                summary: Create a simple task with minimal details
                description: Creates a basic task with required fields only
                value:
                  parentEntityId: ea2586b9-d40a-41c8-808e-2801e33a757d
                  taskName: Review compliance documentation
