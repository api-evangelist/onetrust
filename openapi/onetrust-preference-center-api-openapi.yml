                                  type: string
                                  example: '#696969'
                                buttonFocusTextColor:
                                  description: Applicable to ctv device type only
                                  type: string
                                  example: '#FFFFFF'
                                buttonBorderShow:
                                  description: Applicable to ctv device type only
                                  type: boolean
                                  example: false
                                vendorsListLabel:
                                  type: string
                                  example: Vendors List
                                iabVendorsLabel:
                                  description: Applicable to ctv device type only
                                  type: string
                                  example: IAB Vendors
                                googleVendorsLabel:
                                  description: Applicable to ctv device type only
                                  type: string
                                  example: Google Vendors
                                useRTL:
                                  type: boolean
                                consentText:
                                  type: string
