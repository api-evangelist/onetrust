openapi: 3.2.0
info:
  title: Onetrust Users V2 API
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: 'Operations tagged Users V2 across 2 of this provider''s published API definitions: onetrust-platform-access-management-openapi.json, onetrust-platform-user-provisioning-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Users V2
  description: APIs to manage users and their memberships and access levels.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/platform-access-management.json
  x-displayName: Users V2
paths:
  /api/access/v2/users:
    get:
      operationId: getAllUserDetailsV2
      summary: Get List of Users
      description: Use this API to retrieve a list of all users in your account.
      tags:
      - Users V2
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-access-management.json
      parameters:
      - name: page
        in: query
        description: The page number for the results to be retrieved.
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of records to be retrieved per page.
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 2000
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: 'The sorting criteria in the format: `property,(asc|desc)`. The default sort order is ascending. Multiple sort criteria are supported.'
        schema:
          type: string
          default: name,asc
          enum:
          - name,asc
          - name,desc
          - email,asc
          - email,desc
          - organizationname,asc
          - organizationname,desc
        example: name,asc
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform-AccessManagement_PagePublicOrgUserDetailsResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or missing authentication
        '403':
          description: Forbidden - Insufficient permissions
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - Platform-AccessManagement_OAUTH2:
        - USER
    post:
      operationId: createUserV2
      summary: Create User
      description: Use this API to create a new user in your account.
      tags:
      - Users V2
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-access-management.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Platform-AccessManagement_PublicOrgUserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                description: Identifier of the newly created user
                type: string
        '400':
          description: Invalid request data
        '401':
          description: Unauthorized - Invalid or missing authentication
        '403':
          description: Forbidden - Insufficient permissions
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
