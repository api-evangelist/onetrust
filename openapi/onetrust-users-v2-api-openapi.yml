      - name: organizationId
        in: query
        description: The unique identifier of the organization to set as default.
        required: true
        schema:
          type: string
          format: uuid
        example: d01233a5-482c-4274-8f88-15e24c1c96a5
      responses:
        '204':
          description: Default organization updated successfully
        '400':
