openapi: 3.2.0
info:
  title: Tech Risk & Compliance - IT Risk Management Risk Actions API
  description: The IT Risk Management API provides comprehensive REST endpoints for managing enterprise security controls, threats, vulnerabilities, and their implementations with OAuth2 security and extensive customization capabilities.
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Risk Actions
  description: APIs to manage risk workflow actions including submissions, approvals, exceptions, and stage transitions within the risk lifecycle.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/tech-risk-compliance-it-risk-management.json
  x-displayName: Risk Actions
paths:
  /api/risk/v2/risks/{riskId}/actions/{action}:
    put:
      operationId: performRiskActionUsingPUT
      summary: Perform Risk Action
      description: '> ❗️ End of Support Notification

        >

        > As of September 23, 2025, this API is now deprecated. For more information, see OneTrust API Sunsetting & Deprecation Guidelines.


        Use this API to perform an action on the specified risk.


        > 👍

        >

        > For more information, see About Risk Management Workflows.'
      tags:
      - Risk Actions
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/65b9576864527400108c5f69
      parameters:
      - name: riskId
        in: path
        description: Unique identifier of the risk
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: action
        in: path
        description: Action to perform on the risk
        required: true
        schema:
          type: string
          enum:
          - RISK_CREATED
          - RECOMMENDATION_ADDED
          - RECOMMENDATION_REMOVED
          - RECOMMENDATION_SEND
          - REMEDIATION_PROPOSED
          - REMEDIATION_APPROVED
          - REMEDIATION_REJECTED
          - REMEDIATION_REMOVED
          - EXCEPTION_REQUESTED
          - EXCEPTION_GRANTED
          - EXCEPTION_REJECTED
          - EXCEPTION_REMOVED
          - DEFAULT
        example: RECOMMENDATION_SEND
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechRiskCompliance-Risk_RiskInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-Risk_OAUTH2:
        - INTEGRATION
        - RISK
