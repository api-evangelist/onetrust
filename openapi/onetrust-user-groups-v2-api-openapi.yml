openapi: 3.2.0
info:
  title: Platform - Access Management User Groups V2 API
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: The Access Management APIs enable you to programmatically control user access, manage organizational hierarchies, and monitor authentication activities across your OneTrust platform.
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: User Groups V2
  description: APIs to manage user groups and their memberships. Create groups to organize users, assign permissions collectively, add or remove members, and retrieve information about existing groups and their members.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/platform-access-management.json
  x-displayName: User Groups V2
paths:
  /api/access/v2/user-groups:
    get:
      operationId: getAllUserGroupWithFiltersV2
      summary: Get List of User Groups
      description: Use this API to retrieve a list of user groups, with support for pagination and filtering.
      tags:
      - User Groups V2
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-access-management.json
      parameters:
      - name: page
        in: query
        description: The page number for the results to be retrieved.
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of records to be retrieved per page.
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 2000
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: 'The sorting criteria in the format: `property,(asc|desc)`. The default sort order is ascending. Multiple sort criteria are supported.'
        schema:
          type: string
          default: name,asc
          enum:
          - name,asc
          - name,desc
          - description,asc
          - description,desc
          - createdDate,asc
          - createdDate,desc
          - lastModifiedDate,asc
        example: name,asc
      - name: filters
        in: query
        description: The filters to apply to the user groups.
        schema:
          type: string
        examples:
          Contains filter:
            summary: Filter by name containing value 'ministr'. Value should prefixed and suffixed by % characters
            description: Contains filter
            value: 'name=~=%ministr% '
          Equal to filter:
            summary: Filter by name equal to 'Administrators'
            description: Equal to filter
            value: name==Administrators
          Starts with filter:
            summary: Filter by name starting with 'Admin'. Value should suffixed by % character
            description: Starts with filter
            value: name=sw=Admin%
          Ends with filter:
            summary: Filter by name ending with 'tors'. Value should prefixed by % character
            description: Ends with filter
            value: name=ew=%tors
      responses:
        '200':
          description: User groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform-AccessManagement_PagePublicUserGroupResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or missing authentication
        '403':
          description: Forbidden - Insufficient permissions
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - Platform-AccessManagement_OAUTH2:
        - USER
