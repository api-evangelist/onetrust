        latestGeoLocation:
          description: Latest Geolocation parameters of the DataSubject
          $ref: '#/components/schemas/DSPreferneceCache_DataSubjectGeolocation'
    DSPreferneceCache_CosmosDsAttachment:
      type: object
      properties:
        attachmentId:
          type: string
          format: uuid
        fileName:
          type: string
        uploadedBy:
          type: string
        uploadDate:
          type: string
          format: date-time
    DSPreferneceCache_LinkToken:
