                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - TechRiskCompliance-Risk_OAUTH2:
        - INTEGRATION
        - RISK
components:
  schemas:
    TechRiskCompliance-Risk_RiskLinkRequest:
      type: object
      properties:
        riskIds:
          description: List of risk Ids that will be linked to or unlinked from the target entity. Must contain at least one valid risk ID
          type: array
          items:
            type: string
            format: uuid
            description: List of risk Ids that will be linked to or unlinked from the target entity. Must contain at least one valid risk ID
          format: uuid
          example:
          - 123e4567-e89b-12d3-a456-426614174001
          - 987fcdeb-51a2-43d7-9abc-123456789013
          maxItems: 2147483647
          minItems: 1
        riskSourceInformation:
          description: source information
          $ref: '#/components/schemas/TechRiskCompliance-Risk_RiskSourceInformation'
        origin:
          description: origin of the risk
          type: string
          example: RISK
          enum:
          - ASSESSMENT
          - RISK
      required:
      - riskIds
      - riskSourceInformation
    TechRiskCompliance-Risk_InventoryInformation:
      type: object
      properties:
        inventoryId:
          description: Unique Identifier of the Inventory
          type: string
          format: uuid
          example: 57a87cd3-0a1f-4439-bd5b-917e1d23eb5c
        inventoryName:
          description: Name of the Inventory
          type: string
          example: Raw Materials Inventory
          maxLength: 2000
        inventoryType:
          description: Type of the Inventory
          type: string
          example: VENDORS
          enum:
          - ASSETS
          - PROCESSING_ACTIVITIES
          - VENDORS
          - ENTITIES
          deprecated: true
        sourceType:
          description: Type of Inventory
          $ref: '#/components/schemas/TechRiskCompliance-Risk_EntityTypeInformation'
        softInherited:
          description: Soft Inherited flag
          type: boolean
          example: true
        organizationId:
          description: Unique Identifier of the organization
          type: string
          format: uuid
          example: f8583fd1-21cb-4c7c-a337-2982246418e5
    TechRiskCompliance-Risk_ProbabilityLevelDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        value:
          type: integer
          format: int64
        position:
          type: integer
          format: int64
    TechRiskCompliance-Risk_StandardRiskScoreSettingDto:
      type: object
      properties:
        riskLevels:
          type: array
          items:
            $ref: '#/components/schemas/TechRiskCompliance-Risk_RiskLevelDto'
    TechRiskCompliance-Risk_Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    TechRiskCompliance-Risk_BasicEntityDetail:
      type: object
      properties:
        id:
          description: Unique Identifier for the Entity
          type: string
          format: uuid
          example: e549ec16-b42a-4612-a402-3fcce7cc5f78
        name:
          description: Name for the Entity
          type: string
          example: Acme Corp, John Doe
          maxLength: 300
    TechRiskCompliance-Risk_CategoryInformation:
      type: object
      properties:
        id:
          description: Unique identifier of the category
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          description: Name of the category
          type: string
          example: Security
        nameKey:
          description: Localization key for the category name
          type: string
          example: RiskCategory.Security
        seeded:
          description: Indicates if this is a seeded (pre-defined) category
          type: boolean
          example: true
        archived:
          description: Indicates if the category is archived
          type: boolean
          example: false
        description:
          description: Detailed description of the category
          type: string
          example: Security related risks and controls
        descriptionKey:
          description: Localization key for the category description
          type: string
          example: RiskCategory.Security.Description
    TechRiskCompliance-Risk_ControlRequestDto:
      type: object
      properties:
        identifier:
          description: The identifier of the control.
          type: string
          example: A.1.1
          maxLength: 50
          minLength: 1
        name:
          description: The name of the control.
          type: string
          example: Control ABC
          maxLength: 300
          minLength: 1
        orgGroupId:
          description: The identifier of the organization the master control is linked to. In general, this is top organization in the org hierarchy.
          type: string
          format: uuid
          example: 1a2b3c4e-5f6g-7h8i-9j0k-1l2m3n4o5p6q
        description:
          description: Description of the control.
          type: string
          example: Testing Control
          maxLength: 3000
          minLength: 0
        recommendation:
          description: The recommendation status of this control based on Athena logic.
          type: string
          example: Recommended
          maxLength: 500
          minLength: 0
        frameworkId:
          description: Identifier of the framework the control is tied to.
          type: string
          format: uuid
          example: 1a2b3c4e-5f6g-7h8i-9j0k-1l2m3n4o5p6q
        frameworkName:
          description: Name of the framework the control is tied to.
          type: string
          example: NIST
          maxLength: 500
          minLength: 0
        frameworkNameKey:
          description: Identifier used for translation of Framework Name.
          type: string
          example: framework.NIST
          maxLength: 500
          minLength: 0
        status:
          description: The new status of the control. This can be Active, Archived, or Pending.
          type: string
