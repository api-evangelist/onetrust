            schema:
              type: string
              oneOf:
              - $ref: '#/components/schemas/AssetInventoryCreateRequest'
              - $ref: '#/components/schemas/VendorInventoryCreateRequest'
              - $ref: '#/components/schemas/EntityInventoryCreateRequest'
              - $ref: '#/components/schemas/PAInventoryCreateRequest'
            examples:
              vendors:
                summary: Vendor Upsert Request
                description: vendors
                value:
                  name: Test Vendor
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
                  type:
                    id: cc11c8a5-bbb3-4377-a33d-52a23b1455f9
                    value: Regulatory
                    seeded: true
                    sequence: 0
              assets:
                summary: Asset Upsert Request
                description: assets
                value:
                  name: Test Asset
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
                  location:
                    value: US East
                    id: b2c4d6e8-1234-5678-9abc-def012345678
              entities:
                summary: Entity Upsert Request
                description: entities
                value:
                  name: Test Entity
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
                  primaryOperatingLocation:
                    value: US East
                    id: b2c4d6e8-1234-5678-9abc-def012345678
              processing-activities:
                summary: Processing Activity Upsert Request
                description: processing-activities
                value:
                  name: Test Processing Activity
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
      responses:
        '200':
          description: OK - Inventory successfully created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpsertInventoryResponse'
              example:
                data:
                  id: c79fb1a9-9406-4e9b-bff7-c72e635ee82b
                  name: Updated Inventory
                  externalId: ext-123
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
