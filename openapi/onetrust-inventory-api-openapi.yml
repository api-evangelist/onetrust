                vendors:
                  summary: Vendor Inventories Paginated Response
                  description: vendors
                  value:
                    data:
                    - id: 9a7c3ec1-7830-4811-8563-36e0a093e7ae
                      name: Vendor Name
                      organization:
                        value: aws
                        id: 01d5d6db-a3f0-424e-9956-cfa205dc8af7
                      type:
                        value: Operations
                        id: a9e976c7-f643-4e3c-94c6-edec5d0279a9
                        valueKey: VendorsTypeOperations
                      isEditable: true
                      isDeletable: true
                      canViewDetails: true
                      status:
                        key: active
                      number: 1
                      isParent: false
                    meta:
                      page:
                        first: true
                        last: true
                        number: 0
                        size: 20
                        totalElements: 1
                        totalPages: 1
                        sort:
                        - direction: ASC
                          property: name
                assets:
                  summary: Asset Inventories Paginated Response
                  description: assets
                  value:
                    data:
                    - id: 9a7c3ec1-7830-4811-8563-36e0a093e7ae
                      name: Asset Name
                      organization:
                        value: aws
                        id: 01d5d6db-a3f0-424e-9956-cfa205dc8af7
                      location:
                        value: US East
                        id: b2c4d6e8-1234-5678-9abc-def012345678
                      isEditable: true
                      isDeletable: true
                      canViewDetails: true
                      status:
                        key: active
                      number: 2
                      isParent: false
                    meta:
                      page:
                        first: true
                        last: true
                        number: 0
                        size: 20
                        totalElements: 1
                        totalPages: 1
                        sort:
                        - direction: ASC
                          property: name
                processing-activities:
                  summary: Processing Activity Inventories Paginated Response
                  description: processing-activities
                  value:
                    data:
                    - id: 9a7c3ec1-7830-4811-8563-36e0a093e7ae
                      name: Processing Activity Name
                      organization:
                        value: aws
                        id: 01d5d6db-a3f0-424e-9956-cfa205dc8af7
                      isEditable: true
                      isDeletable: true
                      canViewDetails: true
                      status:
                        key: active
                      number: 3
                      isParent: false
                    meta:
                      page:
                        first: true
                        last: true
                        number: 0
                        size: 20
                        totalElements: 1
                        totalPages: 1
                        sort:
                        - direction: ASC
                          property: name
                entities:
                  summary: Entity Inventories Paginated Response
                  description: entities
                  value:
                    data:
                    - id: 9a7c3ec1-7830-4811-8563-36e0a093e7ae
                      name: Entity Name
                      organization:
                        value: aws
                        id: 01d5d6db-a3f0-424e-9956-cfa205dc8af7
                      primaryOperatingLocation:
                        value: US East
                        id: b2c4d6e8-1234-5678-9abc-def012345678
                      isEditable: true
                      isDeletable: true
                      canViewDetails: true
                      status:
                        key: active
                      number: 4
                      isParent: false
                    meta:
                      page:
                        first: true
                        last: true
                        number: 0
                        size: 20
                        totalElements: 1
                        totalPages: 1
                        sort:
                        - direction: ASC
                          property: name
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - INVENTORY
        - INVENTORY_READ
        - INVENTORY_WRITE
    post:
      operationId: createInventoryUsingPOST
      summary: Create Inventory
      description: Use this API to create an inventory of a particular type.
      tags:
      - Inventory
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
      parameters:
      - name: schemaName
        in: path
        description: The `name` property of the schema.
        required: true
        schema:
          type: string
          enum:
          - processing-activities
          - vendors
          - assets
          - entities
        example: vendors
      - name: generator
        in: query
        description: Optional generator type for the create operation.
        required: false
        schema:
          type: string
        example: API_INTEGRATION
      - name: createAsMaster
        in: query
        description: Flag to create the inventory as a master record.
        required: false
        schema:
          type: boolean
          default: false
        example: false
      - name: sourceId
        in: query
        description: Optional source inventory UUID to copy from.
        required: false
        schema:
          type: string
          format: uuid
        example: c79fb1a9-9406-4e9b-bff7-c72e635ee82b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              oneOf:
              - $ref: '#/components/schemas/AssetInventoryCreateRequest'
              - $ref: '#/components/schemas/VendorInventoryCreateRequest'
              - $ref: '#/components/schemas/EntityInventoryCreateRequest'
              - $ref: '#/components/schemas/PAInventoryCreateRequest'
            examples:
              vendors:
                summary: Vendor Create Request
                description: vendors
                value:
                  name: Test Vendor
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
                  type:
                    id: cc11c8a5-bbb3-4377-a33d-52a23b1455f9
                    value: Regulatory
                    seeded: true
                    sequence: 0
              assets:
                summary: Asset Create Request
                description: assets
                value:
                  name: Test Asset
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
                  location:
                    value: US East
                    id: b2c4d6e8-1234-5678-9abc-def012345678
              entities:
                summary: Entity Create Request
                description: entities
                value:
                  name: Test Entity
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
                  primaryOperatingLocation:
                    value: US East
                    id: b2c4d6e8-1234-5678-9abc-def012345678
              processing-activities:
                summary: Processing Activity Create Request
                description: processing-activities
                value:
                  name: Test Processing Activity
                  organization:
                    value: aws
                    id: aebedb42-a4fe-4768-aac7-7be1b4c17184
      responses:
        '201':
          description: Created - Inventory successfully created.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/OneTrustResponse'
              example:
                data:
                  id: c79fb1a9-9406-4e9b-bff7-c72e635ee82b
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - INVENTORY
        - INVENTORY_WRITE
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
