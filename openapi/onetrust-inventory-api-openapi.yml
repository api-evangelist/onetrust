openapi: 3.2.0
info:
  title: Onetrust Inventory API
  version: '1.0'
  description: 'Operations tagged Inventory across 2 of this provider''s published API definitions: onetrust-privacy-automation-data-mapping-automation-openapi.json, onetrust-privacy-automation-data-mapping-automation-swagger-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
- url: https://customer.my.onetrust.com/api
tags:
- name: Inventory
  description: APIs used to create and manage inventory records for supported schema types (processing-activities, vendors, assets, entities).
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
paths:
  /api/inventory/v2/inventories/{inventoryId}/attachments:
    post:
      operationId: addAttachmentsToInventoryUsingPOST
      summary: Add Attachments to Inventory
      description: Use this API to add existing attachments to inventory record. Users can see these attached documents under Documents tab of Inventory Details page.
      tags:
      - Inventory
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
      parameters:
      - name: inventoryId
        in: path
        description: The unique identifier of the inventory to which the attachments will be added
        required: true
        schema:
          type: string
          format: uuid
        example: 43fd3a8d-3f6b-464e-bf43-3f0c6c592442
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BasicInventoryAttachmentRequest'
            example:
            - attachmentId: c20b54ea-2787-487f-8bc3-94d38c22204b
              description: ''
              attachmentName: Policies.pdf
              name: Policies.pdf
              performAnalysis: false
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - INVENTORY
        - INVENTORY_WRITE
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /api/inventory/v2/inventories/{schemaName}:
    get:
      operationId: getListOfInventoriesUsingGET
      summary: Get List of Inventories
      description: Use this API to retrieve a paginated list of inventories for a given type.
      tags:
      - Inventory
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/privacy-automation-data-mapping-automation.json
      parameters:
      - name: schemaName
        in: path
        description: The `name` property of the schema. The value can be obtained using the [Get Schemas](/onetrust/reference/getSchemas) API.
        required: true
        schema:
          type: string
          enum:
          - processing-activities
          - vendors
          - assets
          - entities
        example: vendors
      - name: filter
        in: query
        description: 'Filter string for searching inventories. Format: ''searchText=value''.'
        required: false
        schema:
          type: string
        example: searchText=Server
      - name: markForDelete
        in: query
        description: Flag to include soft-deleted inventories.
        required: false
        schema:
          type: boolean
          default: false
        example: false
      - name: page
        in: query
        description: Results page to be retrieved (0..N)
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Number of records per page (1..50)
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
        example: 20
      responses:
        '200':
          description: OK - Successfully retrieved inventory list.
          content:
            application/json:
              schema:
                type: object
                oneOf:
                - $ref: '#/components/schemas/VendorInventoriesPaginatedListResponse'
                - $ref: '#/components/schemas/AssetInventoriesPaginatedListResponse'
                - $ref: '#/components/schemas/EntityInventoriesPaginatedListResponse'
                - $ref: '#/components/schemas/InventoriesPaginatedListResponse'
