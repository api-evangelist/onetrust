openapi: 3.2.0
info:
  title: Onetrust Cookies API
  version: '1.0'
  description: 'Operations tagged Cookies across 2 of this provider''s published API definitions: onetrust-consent-preferences-cookie-consent-openapi.json, onetrust-consent-preferences-cookie-consent-swagger-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{hostname}
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
- url: https://customer.my.onetrust.com/api/cookiemanager
tags:
- name: Cookies
  description: The Cookies APIs are used to manage cookie definitions, categories, and their properties.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
paths:
  /api/cmp/v1/cookies/categorized:
    post:
      operationId: getCategorizedCookies
      summary: Get Categorized Cookies
      description: Use this API to retrieve categorized cookies by domain.
      tags:
      - Cookies
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorizedCookiesRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CookiepediaContribsDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
        - COOKIE_READ
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /api/cmp/v1/webscans/cookies:
    put:
      operationId: bulkEditCookies
      summary: Edit Cookies
      description: Use this API to edit existing cookies.
      tags:
      - Cookies
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CookieUpdateRequestDto'
              uniqueItems: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityActionResponseDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
    post:
      operationId: bulkAddCookies
      summary: Add Cookies
      description: Use this API to add cookies.
      tags:
      - Cookies
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CookieCreationRequestDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityActionResponseDtoCookieEntityDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
    delete:
      operationId: bulkDeleteCookies
      summary: Delete Cookies
      description: Use this API to delete cookies by the specified cookie ID or filter criteria.
      tags:
      - Cookies
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCookieDeletionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityActionResponseDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /api/cmp/v1/webscans/languages/{language}/cookies/filter:
    post:
      operationId: getCookiesByFilter
      summary: Get List of Cookies by Criteria
      description: Use this API to retrieve a list of cookies by the specified filter criteria.
      tags:
      - Cookies
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
      parameters:
      - name: language
        in: path
        description: The language code for localized content.
        required: true
        schema:
          type: string
          maxLength: 5
          minLength: 2
        example: en
      - name: countryCode
        in: query
        description: The country code for regional settings.
        required: false
        schema:
          type: string
          maxLength: 2
          minLength: 2
        example: us
      - name: cookieName
        in: query
        description: The name of the cookie.
        required: false
        schema:
          type: string
          maxLength: 255
        example: cookie123
      - name: sortBy
        in: query
        description: Field to sort by
        required: false
        schema:
          type: string
          enum:
          - cookieName
          - host
          - category
        example: cookieName
      - name: direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
        example: desc
      - name: page
        in: query
        description: The page number for pagination results, starting from 0.
        required: false
        schema:
          type: integer
          example: 1
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The number of items to return per page.
        required: false
        schema:
          type: integer
          example: 10
          default: 10
          maximum: 100
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieFilters'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCookieResponseDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
        - COOKIE_READ
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /api/cmp/v1/webscans/{scanId}/recategorize:
    put:
      operationId: recategorizeCookiesByScan
      summary: Recategorize Cookies
      description: Use this API to initiate cookie recategorization for a scan.
      tags:
      - Cookies
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/consent-preferences-cookie-consent.json
      parameters:
      - name: scanId
        in: path
        description: The unique identifier of the scan.
        required: true
        schema:
          type: string
          format: uuid
        example: f2229953-b4b5-4042-8cb9-b78038cc4c46
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - COOKIE
    servers:
    - url: https://{hostname}
      variables:
        hostname:
          default: hostname
          description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
  /v1/cookies:
    post:
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the cookie.
                  name:
                    type: string
                    description: Name of the cookie.
                  description:
                    type: string
                    description: Purpose of the cookie.
                  host:
                    type: string
                    description: Host of the cookie.
                  path:
                    type: string
                    description: Path of the cookie.
                  source:
                    type: string
                    description: The source from which the cookie is created.
                    example: MANUAL
                  cookieLifeSpan:
                    type: string
                    description: Lifespan of the cookie.
                  httpOnly:
                    type: boolean
                    description: Flag indicating the cookie is Http only or not.
                  secure:
                    type: boolean
                    default: false
                    description: Flag indicating the cookie is secure or not.
                  length:
                    type: integer
                    description: Length of the cookie lifespan.
                  durationType:
                    type: integer
                    description: Unit of time for the cookie lifespan.
        '400':
          description: 'Bad Request.


            **Possible reason**: Invalid or missing parameter passed.'
        '401':
          description: Unauthorized.
        '403':
          description: 'Forbidden.


            **Possible reasons**:

            You do not have enough permissions to invoke this endpoint.'
        '404':
          description: Not Found
        '500':
          description: "Internal Server Error. \n\n**Possible reason**: Cookie with the same name and host already exists."
      summary: Create Cookie
      description: Use this API to create a new cookie.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cookieName:
                  type: string
                  description: Name of the cookie.
                lifespan:
                  type: string
                  enum:
                  - PERSISTENT
                  - SESSION
                  description: Lifespan of the cookie.
                host:
                  type: string
                  description: Host of the cookie.
                description:
                  type: string
                  description: Description of the cookie, It should be 1075 characters or less.
                  default: '""'
                customCategoryName:
                  type: string
                  description: Unique identifier of a cookie category (Cookie Category ID).
                  example: C0001
                length:
                  type: integer
                  description: Length of the cookie lifespan, enter a number greater than 0 if this is a persistent cookie, otherwise leave as 0.
                  default: 0
                durationType:
                  type: integer
                  enum:
                  - 1
                  - 7
                  - 30
                  - 365
                  description: Unit of time for the cookie lifespan, enter 1 (for days), 7 (for weeks), 30 (for months), or 365 (for years) based on the time unit the cookie lifespan is measured in.
                  example: 1, 7, 30, 365
                domainCookieCategoryList:
                  type: array
                  default: []
                  description: A list of domain level categorizations for the Cookie.
                  items:
                    type: object
                    properties:
                      domainId:
                        type: string
                        description: ID of the domain.
                      customCategoryName:
                        type: string
                        description: ID of a cookie category (cookie category id).
                      thirdParty:
                        type: boolean
                        description: Flag indicating if the cookie is third-party or first-party, use False if the cookie is first-Party.
              required:
              - cookieName
              - lifespan
              - host
              - customCategoryName
              - durationType
        description: Configuration for the new cookie
        x-examples:
          application/json:
            cookieName: AnotherTest Cookie
            lifespan: SESSION
            host: test.com
            description: ''
            customCategoryName: C0001
            length: 0
            durationType: 1
            domainCookieCategoryList:
            - domainId: 1f7d9ea1-3f02-4b0a-b1ba-19b3c8e0b38b
              customCategoryName: C0002
              thirdParty: true
      operationId: createNewCookie
      tags:
      - Cookies
      security:
      - oauth2: []
    put:
      responses:
        '200':
          description: Update completed. Response may include error messages indicating what changes were not complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the API.
                  errorMessages:
                    type: array
                    items:
                      type: string
        '400':
          description: 'Bad Request.


            **Possible reason**: Invalid cookieid, please check if cookieId passed is correct.'
        '401':
          description: Unauthorized.
        '403':
          description: 'Forbidden.


            **Possible reasons**:

            You do not have enough permissions to invoke this endpoint. '
        '404':
          description: Not Found.
        '409':
          description: ''
        '429':
          description: 'Too Many Requests

            For more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview).'
          headers:
            Retry-After:
              description: The number of seconds after which requests will be allowed again.
              schema:
                type: integer
                format: int32
            ot-ratelimit-event-id:
              description: The unique identifier for the rate-limiting event.
              schema:
                type: string
                format: uuid
            ot-requests-allowed:
              description: The number of requests allowed within the specified period.
              schema:
                type: integer
                format: int32
            ot-period:
              description: The unit of time for which the rate limit applies.
              schema:
                type: string
                enum:
                - HOUR
                - MINUTE
            ot-request-made:
              description: The number of requests made within the specified period.
              schema:
                type: integer
                format: int32
      summary: Update Cookie
      operationId: updateCookie
      tags:
      - Cookies
      security:
      - oauth2:
        - COOKIE
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cookieId:
                  type: string
                  description: ID of the cookie. This value is obtained from [Create Cookie](/onetrust/reference/createnewcookie) API.
                cookieName:
                  type: string
                  description: Name of the cookie.
                lifespan:
                  type: string
                  enum:
                  - PERSISTENT
                  - SESSION
                  description: Lifespan of the cookie.
                host:
                  type: string
                  description: Host of the cookie.
                description:
                  type: string
                  description: Description of the cookie. or less
                  default: '""'
                thirdPartyDescription:
                  type: string
                  description: Short text describing the host’s purpose or description of the cookie. It should be 1075 characters or less.
                  default: '""'
                customCategoryName:
                  type: string
                  description: Unique identifier of a cookie category (Cookie Category ID).
                  example: C0001
                length:
                  type: integer
                  description: Length of the cookie lifespan, enter a number greater than 0 if this is a persistent cookie, otherwise leave as 0.
                  default: 0
                durationType:
                  type: integer
                  enum:
                  - 1
                  - 7
                  - 30
                  - 365
                  description: Unit of time for the cookie lifespan, enter 1 (for days), 7 (for weeks), 30 (for months), or 365 (for years) based on the time unit the cookie lifespan is measured in.
                  example: 1, 7, 30, 365
                domainCookieCategoryList:
                  type: array
                  default: []
                  description: A list of domain level categorizations for the cookie.
                  items:
                    type: object
                    properties:
                      domainId:
                        type: string
                        description: ID of a domain.
                      customCategoryName:
                        type: string
                        description: Unique identifier of a cookie category (cookie category ID).
                      thirdParty:
                        type: boolean
                        description: Flag indicating if the cookie is third-party or first-party, use false if the cookie is first-party.
                domainToDeleteIds:
                  default: []
                  description: A list of domain IDs to be unassigned from cookie.
                  type: array
                  items:
                    type: string
                domainCookieSource:
                  type: array
                  description: Domain Cookie Source to be added.
                  items:
                    type: object
                    properties:
                      domainId:
                        type: string
                        description: Unique Identifier of a domain.
                      domainCookieSourceRequestDtoList:
                        type: array
                        default: []
                        items:
                          type: object
                          properties:
                            ResourceUrl:
                              type: string
                              example: testUrl
                domainCookieSourceToDelete:
                  type: array
                  description: Domain Cookie Source to be removed.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique Identifier of a domain cookie source.
                descriptionTranslations:
                  type: array
                  description: Description translations
                  items:
                    type: object
                    properties:
                      langCode:
                        type: string
                        description: Language code.
                        example: EN
                      defaultDescription:
                        type: string
                        description: Short text describing what is the purpose of the cookie.
                      thirdPartyDescription:
                        type: string
                        description: Short text describing the host’s purpose or description. of the cookie
              required:
              - cookieId
        x-examples:
          application/json:
            cookieId: 5dd32a8b-de66-42d1-a4d8-0000b6a10b1a
            cookieName: testing
            host: test_host
            description: this is for testing
            customCategoryName: C0001
            lifespan: '1'
            length: '12'
            domainToDeleteIds:
            - 25699e98-dc06-4d1f-b7b7-8c528f768eb0
            domainCookieCategoryList:
            - domainId: c9e7cd88-1a25-4fff-b18b-000ec335782d
              customCategoryName: '12312312312312321'
            - domainId: 3bac22c5-b790-4dc5-9acf-00d7ad485c93
            domainCookieSource:
            - domainId: c9e7cd88-1a25-4fff-b18b-000ec335782d
              domainCookieSourceRequestDtoList:
              - ResourceUrl: testResourceUrl
            domainCookieSourceToDelete:
            - id: c9e7cd88-1a25-4fff-b18b-000ec335782d
            descriptionTranslations:
            - langCode: IT
            - langCode: ES
              defaultDescription: defaultDescription
              thirdPartyDescription: thirdPartyDescription
      description: 'Use this API to update an existing cookie.

        > 🗒 Things to Know

        >

        > - There are two types of IDs for cookies: Cookie ID and Domain Cookie ID. The **Cookies Results All Domains** export can be downloaded from the Categorizations screen in the OneTrust application to select the ID for the `cookieId` parameter.

        > - For manually created cookies, only `cookieName`, `lifespan`, an `host` will be updated.

        > - Values must be passed in all the parameters within `descriptionTranslations` for a cookie translation to be updated.'
    servers:
    - url: https://customer.my.onetrust.com/api/cookiemanager
  /v2/cookie-reports/search:
    post:
      tags:
      - Cookies
      summary: Get List of Cookies by Criteria
      description: 'Use this API to retrieve a list of all cookies by filter criteria.

        > 🗒 Things to Know

        >

        > - If any of the available languages in the OneTrust application is entered as a value for the `language` parameter, cookie categories, descriptions, and third-party descriptions will be translated accordingly.

        > - It is recommended to use the `page` and `size` parameters if the number of cookies is greater than 500.'
      operationId: getCookieReportsUsingPOST
      parameters:
      - in: query
        name: language
        description: Name of the language.
        example: en
        schema:
          type: string
      - in: query
        name: countryCode
        description: Country specific code.
        example: gb
        schema:
          type: string
      - in: query
        name: searchStr
        description: Search string includes either cookie name or host name.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number of the results list (0….N).
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        description: Number of records per page (0…N).
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domains:
                  type: array
