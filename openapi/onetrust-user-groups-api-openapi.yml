        - USER
    delete:
      operationId: deleteUserGroupUsingDELETE
      summary: Delete User Group
      description: Use this API to delete an existing user group.
      tags:
      - User Groups
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-access-management.json
      parameters:
      - name: userGroupId
        in: path
        description: The unique identifier of the user group.
        required: true
        schema:
          type: string
          format: uuid
        example: c01233a5-482c-4274-8f88-15e24c1c96a4
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User group not found
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - Platform-AccessManagement_OAUTH2:
        - USER
  /api/access/v1/user-groups/{userGroupId}/members:
    get:
      operationId: retrieveMembersUsingGET
      summary: Get User Group Members
      description: Use this API to retrieve a list of users that are members of a specific user group.
      tags:
      - User Groups
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-access-management.json
      parameters:
      - name: userGroupId
        in: path
        description: The unique identifier of the user group.
        required: true
        schema:
          type: string
          format: uuid
        example: c01233a5-482c-4274-8f88-15e24c1c96a4
      - name: page
        in: query
        description: The page number to retrieve.
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 1
      - name: size
        in: query
        description: The number of records per page.
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 2000
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: Sort order for the results.
        schema:
          type: string
          default: fullName,asc
          enum:
          - fullName,asc
          - fullName,desc
          - memberId, asc
          - memberId, desc
          - email,asc
          - email,desc
          - enabled,asc
          - enabled,desc
          - createdBy,asc
          - createdBy,desc
          - createdDate,asc
          - createdDate,desc
        example: fullName,asc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform-AccessManagement_PageMemberResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
