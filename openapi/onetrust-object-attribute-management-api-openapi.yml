              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - OBJECT_MANAGER
        - OBJECT_MANAGER_WRITE
  /v1/schema-attributes:
    post:
      operationId: addAttributeUsingPOST
      summary: Add Attribute to Schema
      description: 'Use this API to add an attribute to a specific schema.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Attribute Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: schemaName
        in: query
        description: The name of the attribute schema.
        required: true
        schema:
          description: Name of the schema to add attribute to
          type: string
          example: projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeCreateRequest'
            examples:
              Text Attribute Example:
                summary: Create a simple text attribute
                description: Creates a basic text attribute for the specified schema
                value:
                  nameKey: OneTrustApp.OM.CustomEntity.Attributes.8068bceb-51c3-4ba1-b6e4-90534d81901b
                  name: Text_attribute
                  scoreLevelName: ''
                  descriptionKey: OneTrustApp.OM.CustomEntity.Attributes.3144914a-7c2b-4250-84e8-f8d6fce0e3ad
                  description: desc
                  responseType: Text
                  required: false
                  encrypted: false
                  allowOther: false
                  options: []
                  optionType: none
                  referenceCategoryIds: []
                  formula: null
                  context:
                    parameters:
                      RecomputeFormulaEntities: false
                  responseSubType: null
                  maxMultiSelectAllowedOptionValues: null
                  metadata: ''
              Single Select Attribute Example:
                summary: Create a single select attribute with options
                description: Creates a single select attribute with predefined options
                value:
                  nameKey: OneTrustApp.OM.CustomEntity.Attributes.266289b5-4508-48c5-b0d3-893e87fd7fa4
                  name: Single_select_01
                  scoreLevelName: ''
                  descriptionKey: OneTrustApp.OM.CustomEntity.Attributes.3cd5fa5d-1030-4653-aca6-35b9d6905655
                  description: desc single select
                  responseType: SingleSelect
                  required: false
                  encrypted: false
                  allowOther: false
                  options:
                  - option: '1'
                    optionKey: OneTrustApp.OM.CustomEntity.Attributes.6edee2e0-149e-4c9f-bf80-2d1fa405c620
                  - option: '2'
                    optionKey: OneTrustApp.OM.CustomEntity.Attributes.9b52d0b7-4480-4ab2-9081-622904b4d2e8
                  optionType: none
                  referenceCategoryIds: []
                  formula: null
                  context:
                    parameters:
                      RecomputeFormulaEntities: false
                  responseSubType: null
                  maxMultiSelectAllowedOptionValues: 1
                  metadata: ''
              Date Attribute Example:
                summary: Create a date attribute
                description: Creates a date attribute for tracking deadlines or important dates
                value:
                  nameKey: OneTrustApp.OM.CustomEntity.Attributes.8c0f2378-522a-45a6-a0be-adbd3baef209
                  name: Date_time_01
                  scoreLevelName: ''
                  descriptionKey: OneTrustApp.OM.CustomEntity.Attributes.89872421-7ad9-4ff3-92df-b54efb1f2551
                  description: date and time desc
                  responseType: DateTime
                  required: false
                  encrypted: false
                  allowOther: false
                  options: []
                  optionType: none
                  referenceCategoryIds: []
                  formula: null
                  context:
                    parameters:
                      RecomputeFormulaEntities: false
                  responseSubType: null
                  maxMultiSelectAllowedOptionValues: null
                  metadata: ''
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                description: Created attribute details
                $ref: '#/components/schemas/AttributeInformation'
              examples:
                Text Attribute Response:
                  summary: Response for created text attribute
                  description: Details of the created text attribute
                  value:
                    id: 8068bceb-51c3-4ba1-b6e4-90534d81901b
                    name: Text_attribute
                    nameKey: OneTrustApp.OM.CustomEntity.Attributes.8068bceb-51c3-4ba1-b6e4-90534d81901b
                    description: desc
                    descriptionKey: OneTrustApp.OM.CustomEntity.Attributes.3144914a-7c2b-4250-84e8-f8d6fce0e3ad
                    encrypted: false
                    enabled: true
                    required: false
                    responseType: Text
                    scoreLevelName: ''
                    options: []
                    optionType: none
                    referenceCategoryIds: []
                    responseSubType: null
                    metadata: ''
                    formula: null
                    createdBy: admin@example.com
                    createdTime: '2025-06-18T10:28:19.001Z'
                    lastModifiedBy: admin@example.com
                    lastModifiedTime: '2025-06-18T10:28:19.001Z'
                Single Select Attribute Response:
                  summary: Response for created single select attribute
                  description: Details of the created single select attribute with options
                  value:
                    id: 266289b5-4508-48c5-b0d3-893e87fd7fa4
                    name: Single_select_01
                    nameKey: OneTrustApp.OM.CustomEntity.Attributes.266289b5-4508-48c5-b0d3-893e87fd7fa4
                    description: desc single select
                    descriptionKey: OneTrustApp.OM.CustomEntity.Attributes.3cd5fa5d-1030-4653-aca6-35b9d6905655
                    encrypted: false
                    enabled: true
                    required: false
                    responseType: SingleSelect
                    scoreLevelName: ''
                    options:
                    - option: '1'
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.6edee2e0-149e-4c9f-bf80-2d1fa405c620
                    - option: '2'
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.9b52d0b7-4480-4ab2-9081-622904b4d2e8
                    optionType: none
                    referenceCategoryIds: []
                    responseSubType: null
                    maxMultiSelectAllowedOptionValues: 1
                    metadata: ''
                    formula: null
                    createdBy: admin@example.com
                    createdTime: '2025-06-18T10:28:19.001Z'
                    lastModifiedBy: admin@example.com
                    lastModifiedTime: '2025-06-18T10:28:19.001Z'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
              schema:
                description: The unit of time for which the rate limit applies
                enum:
                - HOUR
                - MINUTE
            ot-ratelimit-event-id:
              schema:
                description: The unique identifier for the rate-limiting event.
                format: uuid
            ot-request-made:
              schema:
                description: The number of requests made within the specified period.
                format: int32
            ot-requests-allowed:
              schema:
                description: The number of requests allowed within the specified period.
                format: int32
        '500':
          description: Internal Server Error
      security:
      - OAUTH2:
        - OBJECT_MANAGER
        - OBJECT_MANAGER_WRITE
        - INTEGRATION
