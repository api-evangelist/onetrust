openapi: 3.2.0
info:
  title: Platform - Object Manager Object Attribute Management API
  version: '1.0'
  contact:
    name: OneTrust Support
    url: https://my.onetrust.com/s/contactsupport
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: The Object Manager APIs are used to integrate external systems and streamline the flow of data for objects created via Object Manager in the OneTrust Platform.
servers:
- url: https://{hostname}/api/custom-entity
  variables:
    hostname:
      default: hostname
      description: The OneTrust hostname such as app.onetrust.com, app-eu.onetrust.com, app-de.onetrust.com, app-uk.onetrust.com, app-apac.onetrust.com, trial.onetrust.com, or uat.onetrust.com.
tags:
- name: Object Attribute Management
  description: The Object Attribute Management APIs are used to manage object attributes.
  externalDocs:
    description: OpenAPI 3.1.0 - Download Definition
    url: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
paths:
  /v1/schema-attribute-options:
    post:
      operationId: addOptionsUsingPOST
      summary: Add Options to Attribute
      description: 'Use this API to add options to an attribute.


        > 🗒 Things to Know

        >

        > - This API only supports objects created via Object Manager, including Projects, Models, and Datasets.'
      tags:
      - Object Attribute Management
      x-onetrust:
        spec-label: https://developer.onetrust.com/onetrust/openapi/platform-object-manager.json
      parameters:
      - name: attributeId
        in: query
        description: The unique identifier of the attribute.
        required: true
        schema:
          description: ID of the attribute to add options to
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Array of attribute options
              type: array
              items:
                $ref: '#/components/schemas/AttributeOptionRequest'
            examples:
              Simple Options Example:
                summary: Add basic options to an attribute
                description: Adds three simple options to a select attribute
                value:
                - option: e
                  optionKey: OneTrustApp.OM.CustomEntity.Attributes.a736fc55-7e46-49a5-9e32-c4e3e25d6684
                - option: f
                  optionKey: OneTrustApp.OM.CustomEntity.Attributes.46fe357c-f1e1-475d-8ee0-45359e6debbb
                - option: g
                  optionKey: OneTrustApp.OM.CustomEntity.Attributes.06f7fbb3-dddb-40b9-aa5f-00a7271da9e3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Attribute details with added options
                $ref: '#/components/schemas/AttributeInformation'
              examples:
                Updated Attribute With Options:
                  summary: Response showing attribute with added options
                  description: Details of the attribute after new options were added
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174001
                    name: Category_select
                    nameKey: OneTrustApp.OM.CustomEntity.Attributes.123e4567-e89b-12d3-a456-426614174001
                    description: Selection of available categories
                    descriptionKey: OneTrustApp.OM.CustomEntity.Attributes.5591a97c-3dbf-4ba9-8770-11ed6c3e9172
                    encrypted: false
                    enabled: true
                    required: false
                    responseType: SingleSelect
                    scoreLevelName: ''
                    options:
                    - option: a
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.79b34d2e-1426-401e-83b2-4fb29c67ac12
                    - option: b
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.b2a71c8e-7f80-4e87-9e6d-54f2acb93f15
                    - option: c
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.a1fc2c44-3d8e-4376-af6c-2bdd33a4e0c9
                    - option: d
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.5ae7d232-0489-4f9d-9645-7a56f3a0a190
                    - option: e
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.a736fc55-7e46-49a5-9e32-c4e3e25d6684
                    - option: f
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.46fe357c-f1e1-475d-8ee0-45359e6debbb
                    - option: g
                      optionKey: OneTrustApp.OM.CustomEntity.Attributes.06f7fbb3-dddb-40b9-aa5f-00a7271da9e3
                    optionType: none
                    referenceCategoryIds: []
                    responseSubType: null
                    maxMultiSelectAllowedOptionValues: null
                    metadata: ''
                    formula: null
                    createdBy: admin@example.com
                    createdTime: '2025-06-18T10:30:15.123Z'
                    lastModifiedBy: admin@example.com
                    lastModifiedTime: '2025-06-18T10:59:44.987Z'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeInformation'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: "Too Many Requests. \nFor more information, see [API Rate Limits](https://developer.onetrust.com/onetrust/reference/rate-limits-overview)."
          headers:
            Retry-After:
              schema:
                description: The number of seconds after which requests will be allowed again.
                format: int32
            ot-period:
