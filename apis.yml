aid: onetrust
url: https://raw.githubusercontent.com/api-evangelist/onetrust/refs/heads/main/apis.yml
name: OneTrust
kind: company
description: >-
  OneTrust is an enterprise trust, privacy, and AI-governance platform. Its developer portal publishes
  37 downloadable OpenAPI definitions covering roughly 631 operations across Universal Consent &
  Preference Management, Cookie Consent / CMP, Consent Receipts, Data Subject Request (DSR) Automation,
  Assessment Automation (PIA/DPIA), Data Mapping, Data Catalog and Data Discovery, Incident Management,
  IT & Security Risk Management, Audit Management, Issues Management, Enterprise Policy Management,
  Compliance Automation, Third-Party Risk Management, ESG Program Reporting, AI Governance, and the
  shared platform services (Access Management, SCIM 2.0 User Provisioning, Object Manager, Inventory,
  Bulk Export, Documents, Integrations, Task Management, Global Activity). Every API is authorized with
  OAuth 2.0 client credentials against a per-tenant environment host, and the portal also serves an
  RFC 9727 /.well-known/api-catalog, an llms.txt, and a public remote MCP server.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
