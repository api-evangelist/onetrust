description: 'OneTrust publishes no self-serve price. The pricing page is a contact-sales funnel: it names
  the product modules and the buying motion but attaches no number, no tier and no included quota to any
  of them. Subscriptions are negotiated per module and scaled by headcount, entity count and geography.
  The only published, quantified entitlements anywhere in the OneTrust surface are the API rate limits
  (200,000 requests/hour per account, 1,000/minute per endpoint; 50,000 and 250 in sandbox) and the Bulk
  Export credit balance the API exposes at GET /api/ot-insights/v1/bulk-export-jobs/credits — which is
  the closest thing OneTrust has to a metered unit a customer can read programmatically.'
notes: Enterprise contact-sales only. Recorded as plan_count 1 (the single 'contact sales' enterprise
  plan) rather than 0, because OneTrust does publish a named commercial motion and a module list — it
  just publishes no price against them. A free trial tenant (trial.onetrust.com) exists but is sales-provisioned,
  not self-serve.
sources:
- https://www.onetrust.com/pricing/
- https://developer.onetrust.com/onetrust/reference/rate-limits-overview
