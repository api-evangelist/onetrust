summary: >-
  One real document was served: an RFC 9727 API catalog on the developer portal. The root
  /.well-known/api-catalog on developer.onetrust.com is a linkset that points at a second, fuller
  linkset under the /onetrust branch, which enumerates all 37 published OpenAPI definitions with
  type application/vnd.oai.openapi+json. my.onetrust.com serves an OpenID Connect discovery document,
  but it describes the Salesforce Experience Cloud identity provider behind the OneTrust support
  community (its scopes_supported are Salesforce's: cdp_ingest_api, pardot_api, wave_api), NOT the
  OneTrust platform API — the platform API uses OAuth 2.0 client credentials at
  https://{hostname}/api/access/v1/oauth/token. No security.txt, no ai-plugin.json, no agent card.
notes:
- developer.onetrust.com answers HTTP 200 with the ReadMe single-page-app shell (1.79 MB of HTML) for
  every unmatched path. Those 200s are recorded below as shell, not as documents.
- www.onetrust.com returns 403 from a bot challenge on every /.well-known/* path; that is our crawler
  being turned away, not evidence the provider serves nothing.
