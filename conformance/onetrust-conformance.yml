summary: >-
  OneTrust's contracts declare three domain standards for its own markets — IAB TCF (EU v2.2 and
  Canada) and IAB GPP in the consent surface, and SCIM 2.0 in user provisioning, complete with the
  registered schema URNs. Those are signature-level declarations inside the spec, not marketing claims,
  and they are exactly what a buyer who already speaks the standard needs to see. Cross-cutting web
  standards are a weaker story: OAuth 2.0 client credentials yes, OIDC no, RFC 9457 no, RFC 8594 no.
