- name: Cursor
  config: '{"mcpServers":{"OneTrust Developer Portal":{"url":"https://developer.onetrust.com/mcp"}}}'
- name: Windsurf
  config: '{"mcpServers":{"OneTrust Developer Portal":{"serverUrl":"https://developer.onetrust.com/mcp"}}}'
tools:
- name: list-endpoints
  title: List API Endpoints
  description: Lists all API paths and their HTTP methods with summaries, organized by path.
  input_schema_properties:
  - title
- name: get-endpoint
  title: Get Endpoint Details
  description: Gets detailed information about a specific API endpoint, including security schemes and
    servers.
  input_schema_properties:
  - path
  - method
  - title
- name: search-endpoints
  title: Search API Endpoints
  description: Deep search through paths, operations and parameters to discover relevant API endpoints.
  input_schema_properties:
  - pattern
- name: list-specs
  title: List OpenAPI Specs
  description: Lists all available OpenAPI specs. Use the title to select a spec.
  input_schema_properties: []
- name: execute-request
  title: Execute API Request
  description: Executes an API request with a given HAR request object.
  input_schema_properties:
  - harRequest
  - title
  consequence: write
  note: This is the only write-capable tool. It will execute ANY method against any OneTrust operation
    the caller supplies credentials for, so agent policy must gate it, not the server.
- name: get-server-variables
  title: Get Server Variables
  description: Gets the server variables for each server within a specific OpenAPI spec.
  input_schema_properties:
  - title
caveats:
- The server is a generic OpenAPI navigator, not a curated OneTrust product MCP. Tool names do not map
  one-to-one to OneTrust resources.
- No authentication is required to LIST the tools or read the specs; calling a OneTrust operation through
  execute-request still requires the caller's own OAuth 2.0 bearer token.
- mcp.onetrust.com does not resolve to an MCP server (nginx 404); app.onetrust.com/mcp returns 401.
