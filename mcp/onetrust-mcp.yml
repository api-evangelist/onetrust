name: OneTrust Developer Portal MCP Server
description: 'OneTrust hosts a public remote MCP server on its developer portal. It is documented on a
  dedicated "MCP Server" page in the API reference, requires no authentication headers, and answered a
  live tools/list with six tools. The server is the ReadMe developer-hub MCP: it navigates and executes
  against OneTrust''s 37 published OpenAPI definitions rather than exposing a bespoke OneTrust product
  tool surface. That is still a real, reachable agent surface — an agent can list, search and call any
  OneTrust operation through it — but the tool names are generic and the per-operation input schema is
  reached through get-endpoint rather than declared as a tool of its own.'
deployment:
  mode: remote
  endpoint: https://developer.onetrust.com/mcp
  auth: none
  verified: probed
  probe_prior: (never probed)
  probe: live
  probe_why: live
