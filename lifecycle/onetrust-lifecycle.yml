  components: OneTrust core platform components and APIs; environment hosting locations, maintenance
    history, performance metrics and availability reports.
  note: >-
    status.onetrust.com resolves (302) to https://my.onetrust.com/s/system-status. The page is a
    Salesforce Experience Cloud surface rendered client-side, so it has no machine-readable
    /api/v2/status.json the way a Statuspage.io host would. The developer portal itself is hosted on
    ReadMe and has a separate status feed at https://www.readmestatus.com.
