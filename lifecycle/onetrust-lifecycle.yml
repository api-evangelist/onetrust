  observed_versions: [v1, v2, v3, v4]
  platform_release_scheme: CalVer
  platform_release_example: 202608.1.0
  docs: https://developer.onetrust.com/onetrust/reference/quick-start-guide
deprecation_policy:
  published: true
  url: https://developer.onetrust.com/onetrust/reference/onetrust-api-sunsetting-deprecation-guidelines
  phases:
  - name: Sunsetting Period
    duration: 3-6 months after the deprecation announcement
    behavior: >-
      API continues to be supported; no new features and no non-critical fixes. OneTrust monitors usage
      of the deprecated API and proactively notifies customers still calling it.
  - name: Deprecation Period
    duration: typically 12 months after the sunsetting period ends
    behavior: >-
      Critical support only. OneTrust implements an RFC 7234 §5.5.7 `299` warning on the API backend.
  signal_headers:
    implemented:
    - name: Warning
      code: 299
      standard: RFC 7234 §5.5
      note: Applied during the Deprecation Period.
    not_implemented:
    - name: Deprecation
      standard: RFC 8594
    - name: Sunset
      standard: RFC 8594
  exceptions: Handled case by case and communicated in the initial deprecation notice.
