provider: OneTrust
providerId: onetrust
summary: >-
  OneTrust publishes a written two-phase sunset/deprecation policy, a dated list of every API currently
  in each phase, a release changelog, and a status page. It is one of the more complete lifecycle
  postures in the privacy/GRC cohort. The notable gap: the policy commits to an RFC 7234 `299` warning
  header during the deprecation period, NOT to RFC 8594 `Deprecation` / `Sunset` headers — so a client
  gets a cache-warning class signal rather than the standard machine-readable one, and none of the 37
  OpenAPI definitions carries `deprecated: true` on the operations the docs list as deprecated.
versioning:
