docs: https://developer.onetrust.com/onetrust/reference/oauth-20-scopes
provider: OneTrust
providerId: onetrust
summary: 'OneTrust publishes a full OAuth 2.0 scope reference: an Available Areas & Scopes table per cloud
  (Platform, Privacy & Data Governance, Tech Risk & Compliance) giving each scope a description, and a
  Scope to API Assignments table listing the exact METHOD + PATH each scope unlocks. That second table
  is the useful one and it is rare — most providers document scope names and leave you to guess the mapping.
  Scopes are selected when the client credential is created in Global Settings and cannot be widened at
  token-request time, which is why a 403 is the most common OneTrust integration failure.'
flow: clientCredentials
token_url: https://{hostname}/api/access/v1/oauth/token
scope_count: 51
granularity: module + read/write split
notes:
- Scope names are UPPER_SNAKE and module-scoped; a read-only variant exists for most write scopes (CONSENT/CONSENT_READ,
  INVENTORY/INVENTORY_READ, VRM/VRM_READ).
- DATA_CATALOG_WRITE is documented with "No API Assignments" — a scope that currently unlocks nothing.
- 'Every scope in the docs is also declared in at least one OpenAPI securityScheme, and the spec declares
  a few the docs table does not describe; those are flagged described_in_docs: false below.'
