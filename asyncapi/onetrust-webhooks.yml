provider: OneTrust
providerId: onetrust
summary: >-
  OneTrust has a real webhook surface and no published event catalog. Webhook triggers are configured
  in the OneTrust Integrations module — a customer picks the event and the destination URL inside the
  application — so the event vocabulary is tenant-configurable rather than a fixed, documented list.
  The strongest public evidence that the surface exists and carries production volume is the rate-limit
  table: OneTrust provisions 3,000 webhook calls per minute against /integrationmanager/api/v1/webhook/*
  and blocks the account for a minute past that. What is missing is the thing an agent or an integrator
  needs — the names of the events, their payload schemas, the delivery/retry semantics, and any
  signature verification scheme.
asyncapi:
  published: false
  probes:
  - url: https://developer.onetrust.com/onetrust/asyncapi.yaml
    status: 404
  - url: https://developer.onetrust.com/asyncapi.json
    status: 200
    verdict: SPA shell, not a document
  note: >-
    No AsyncAPI document is published. The RFC 9727 api-catalog at
    https://developer.onetrust.com/onetrust/.well-known/api-catalog lists 37 entries and every one is
    type application/vnd.oai.openapi+json — no AsyncAPI, no event contract.
webhooks:
  supported: true
  direction: outbound
  configuration: OneTrust application — Integrations menu, "webhook triggers"
  docs:
  - name: Integrating with Webhooks (developer portal)
