  - name: Managing Custom Integration Workflows
    url: https://my.onetrust.com/s/article/UUID-24759a6f-c3a1-4919-d0d7-caa041d68727
  transport: HTTP POST to a customer-defined endpoint URL
  payload_format: JSON
  rate_limit:
    limit: 3000
    window: minute
    path: /integrationmanager/api/v1/webhook/*
    on_violation: Traffic is blocked from the account for 1 minute.
    source: https://developer.onetrust.com/onetrust/reference/rate-limits-overview
  related_api:
    spec: openapi/onetrust-platform-integrations-openapi.json
    server: https://{hostname}/api/integrationmanager
    note: >-
      The Integrations API manages system credentials and workflows (Workflows V2). It is the control
      plane for the integration/webhook machinery; it does not publish the event catalog.
  event_catalog:
    published: false
    note: >-
      No enumerated event list, no payload schemas, no documented retry/backoff policy, and no
      documented signature header for verifying that a delivery came from OneTrust. A receiver cannot
      authenticate a OneTrust webhook from the public documentation.
gaps:
- No AsyncAPI or CloudEvents contract.
- No published event name registry.
- No published payload schemas.
- No documented delivery guarantees, retry policy or dead-letter behavior.
- No documented signing/verification scheme for inbound deliveries.
