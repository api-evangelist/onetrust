provider: OneTrust
providerId: onetrust
summary: >-
  OneTrust is not one data model, it is roughly a dozen module models sharing a small platform spine.
  1,272 component schemas are declared across the 37 definitions and almost none are reused between
  them — every module namespaces its own copies (ConsentPreferences-UniversalConsentPreferenceManag_*,
  TechRiskCompliance-ITRiskManagement_*, ...), so a PageableObject in the consent surface is a
  different schema from the identical PageableObject in the risk surface. The graph below is the one
  that matters to an integrator: what actually joins across modules is Organization, User/User Group,
  Inventory, Attachment and the Object Manager custom-entity layer.
schema_count: 1272
cross_module_reuse: false
platform_spine:
- entity: Organization
  id_field: organizationId / orgGroupId / externalId
  module: Platform - Access Management
  note: >-
    orgGroupId appears in 59 schemas — the single most-referenced identifier in the platform. Almost
    every module scopes its records to an org group.
- entity: User
  id_field: userId / id
  module: Platform - Access Management, Platform - User Provisioning (SCIM 2.0)
- entity: UserGroup
  id_field: userGroupId / groupId
  module: Platform - Access Management, Platform - User Provisioning
- entity: Attachment
  id_field: attachmentId / fileId
  module: Platform - Documents
  note: Referenced from assessments, incidents, consent receipts and enterprise policy documents.
- entity: InventoryRecord
  id_field: inventoryId
  module: Platform - Inventory, Privacy Automation - Data Mapping
- entity: CustomEntity
  id_field: entityId / entityTypeId
  module: Platform - Object Manager, AI Governance
  note: >-
    Object Manager (/api/custom-entity/*) and AI Governance (/api/ai-governance/v1/entities) share the
    same entity/entity-type/relationship/attribute shape. AI Governance is Object Manager applied to
    AI systems.
- entity: Task
  id_field: assigneeId / assignmentId / stageId
  module: Platform - Task Management, AI Governance, Object Manager
