- registry: github
  query: https://github.com/onetrust
  result: >-
    NOT OneTrust. github.com/onetrust is a personal user account with one public repo, an Arduino AVR
    ISP shield from 2013. The apis.yml GitHubOrganization pointer previously named it; it has been
    repointed at https://github.com/onetrust-oss, which GitHub reports as name "OneTrust" with
    onetrust.com in its profile.
