provider: OneTrust
providerId: onetrust
summary: >-
  OneTrust's first-party client libraries are CONSENT SDKs, not API clients. There is no OneTrust SDK
  for the 631-operation REST platform in any language — a developer calling the OneTrust APIs writes
  raw HTTP. What OneTrust does ship is a mobile/OTT/web Consent Management Platform SDK family
  (Android, iOS/tvOS, React Native, Cordova/Ionic, Flutter, Roku, Fire TV, Web) plus one Python SDK for
  the AI Guard service. The CMP packages are versioned on the platform's CalVer train and were current
  as of the probe; the Maven web-sdk artifact has not shipped since 2022 and the Adobe extension since
  2019.
decay_signals:
- >-
  react-native-onetrust-cmp and cordova-plugin-onetrust-cmp both sit at 202608.1.0, the same release
  string as the OneTrust 202608.1.0 (Summer) platform release announced 2026-08-07 — the strongest
  currency signal available here.
- >-
  com.onetrust.cmp:web-sdk last published 2022-03-14 on Maven Central. The supported Web CMP is
  distributed from the OneTrust CDN, not Maven, so this artifact is a stale mirror rather than the
  shipping product.
- com.onetrust.mobile:onetrust_adobe_extension last published 2019-02-04.
